{{/*
Ingress Gateway (Gateway API, istio class): one per element of the
gateways list. infrastructure.parametersRef references a ConfigMap (see
configmap.yaml), which has the same name as the Gateway (kindShort cm).
For HTTPS/TLS listeners the tls block is added automatically. Terminate
points at the Secret of the certificate that covers the listener hostname
(see tls in values and externalSecret.yaml), or at certificateRefs when the
certificate already lies in the cluster under its own name.
The element is skipped when enabled: false.
*/}}
{{- if eq (include "ingress-gateway.helpers.chartEnabled" .) "true" }}
{{- $root := . -}}
{{- /* Always rendered, so this is where the whole release is checked for names that would collide in the cluster. */ -}}
{{- include "ingress-gateway.helpers.app.uniqueNames" $root -}}
{{- range $index, $gateway := $root.Values.gateways }}
{{- if eq (include "ingress-gateway.helpers.app.enabled" $gateway) "true" }}
{{- $gatewayName := required (printf "gateways[%d].name is required" $index) $gateway.name }}
{{- $gatewayFullname := include "ingress-gateway.helpers.app.resourceName" (dict "kind" "Gateway" "name" $gatewayName "context" $root) }}
{{- $configMapName := include "ingress-gateway.helpers.app.resourceName" (dict "kind" "ConfigMap" "name" $gatewayName "context" $root) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayFullname }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "ingress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $configMapName }}
  listeners:
    {{- range $listenerIndex, $listener := $gateway.listeners }}
    - name: {{ $listener.name | default (printf "listener-%d" $listenerIndex) | quote }}
      port: {{ required (printf "gateways[%d].listeners[%d].port is required" $index $listenerIndex) $listener.port }}
      protocol: {{ required (printf "gateways[%d].listeners[%d].protocol is required" $index $listenerIndex) $listener.protocol | quote }}
      {{- $protocol := upper ($listener.protocol | toString) }}
      {{- /* hostname is valid only for HTTP, HTTPS and TLS: the API server rejects a Gateway that carries it on a TCP or UDP listener. */}}
      {{- if and $listener.hostname (has $protocol (list "HTTP" "HTTPS" "TLS")) }}
      hostname: {{ include "ingress-gateway.helpers.tplvalues.render" (dict "value" $listener.hostname "context" $root) | quote }}
      {{- end }}
      {{- if or (eq $protocol "HTTPS") (eq $protocol "TLS") }}
      tls:
        {{- /* Passthrough by default; the Secret name comes from the matching tls entry. */}}
        {{- $tlsMode := $listener.tlsMode | default "Passthrough" }}
        mode: {{ $tlsMode | quote }}
        {{- if eq $tlsMode "Terminate" }}
        certificateRefs:
          {{- if $listener.certificateRefs }}
          {{- toYaml $listener.certificateRefs | nindent 10 }}
          {{- else }}
          {{- $cert := fromJson (include "ingress-gateway.helpers.app.certificate" (dict "hostname" $listener.hostname "context" $root)) }}
          {{- if not $cert }}
          {{- fail (printf "gateways[%d].listeners[%d]: no certificate covers hostname %q - add an entry to tls.certificates with a domain that covers it" $index $listenerIndex ($listener.hostname | default "" | toString)) }}
          {{- end }}
          - name: {{ include "ingress-gateway.helpers.app.tlsSecretName" (dict "name" $cert.name "parent" $gatewayName "context" $root) | quote }}
            kind: Secret
            group: ""
          {{- end }}
        {{- end }}
      {{- end }}
      {{- /* namespaces is hidden from users and pinned to "Same" for now; only kinds is user-supplied. */}}
      {{- $ar := $listener.allowedRoutes | default dict }}
      allowedRoutes:
        namespaces:
          from: Same
        {{- with $ar.kinds }}
        kinds:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
