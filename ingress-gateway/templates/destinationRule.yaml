{{/*
DestinationRule (Istio) for every Service a route pins clients to: one per
Service named in xroutes[].rules[].backendRefs[] with sessionAffinity. The
Gateway API field for this, sessionPersistence, is not implemented by Istio,
so the pinning is done the Istio way: a consistent hash on a cookie the
gateway issues, and every request that carries it lands on the same endpoint.
The rule lives in the namespace of the release with exportTo ".", so only the
proxies of this namespace, the gateways of the release, see it: a rule in the
namespace of the Service would change how every client in the mesh reaches
it. The host is the full cluster name of the Service, so a Service in another
namespace is matched exactly.
The gateway picks the endpoint itself, so the rule holds. It stops holding
when the Service, or its namespace, carries istio.io/ingress-use-waypoint:
"true": ingress traffic then goes through the waypoint, which balances on its
own. README says so.
Which rules exist is decided by ingress-gateway.helpers.app.sessionAffinities:
one per Service, and two references that disagree stop the render.
*/}}
{{- if eq (include "ingress-gateway.helpers.chartEnabled" .) "true" }}
{{- $root := . -}}
{{- $affinities := include "ingress-gateway.helpers.app.sessionAffinities" $root | fromJson }}
{{- range $key, $affinity := $affinities }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  {{- /* Named after the Service, which is a DNS label of up to 63 characters, not a short token of the order. */}}
  name: {{ include "ingress-gateway.helpers.app.resourceName" (dict "kind" "DestinationRule" "name" $affinity.name "nameMax" 63 "context" $root) }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "ingress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  host: {{ printf "%s.%s.svc.cluster.local" $affinity.name $affinity.namespace | quote }}
  exportTo:
    - "."
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: {{ $affinity.cookieName | quote }}
          ttl: {{ $affinity.ttl | quote }}
{{- end }}
{{- end }}
