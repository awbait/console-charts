{{/*
ExternalSecret (External Secrets Operator) per certificate that the Gateway
listeners actually use: it reads the certificate from the store (Vault) and
keeps a kubernetes.io/tls Secret in the release namespace up to date. The
certificate and its key never travel through values, only the path does.

A listener takes part when its protocol is HTTPS or TLS, tlsMode is Terminate
and certificateRefs is not set (with certificateRefs the certificate already
lies in the cluster and the chart keeps its hands off). The entry that covers
the listener hostname is looked up in tls.certificates and then in
tls.platform; duplicates by name are collapsed.
*/}}
{{- if eq (include "ingress-gateway.helpers.chartEnabled" .) "true" }}
{{- $root := . -}}
{{- $tls := $root.Values.tls | default dict -}}
{{- $seen := dict -}}
{{- range $gIndex, $gateway := $root.Values.gateways }}
{{- if eq (include "ingress-gateway.helpers.app.enabled" $gateway) "true" }}
{{- range $lIndex, $listener := $gateway.listeners }}
{{- $protocol := upper ($listener.protocol | default "" | toString) }}
{{- $tlsMode := $listener.tlsMode | default "Passthrough" }}
{{- if and (or (eq $protocol "HTTPS") (eq $protocol "TLS")) (eq $tlsMode "Terminate") (not $listener.certificateRefs) }}
{{- $cert := fromJson (include "ingress-gateway.helpers.app.certificate" (dict "hostname" $listener.hostname "context" $root)) }}
{{- $gatewayName := required (printf "gateways[%d].name is required" $gIndex) $gateway.name }}
{{- $key := printf "%s/%s" $gatewayName ($cert.name | default "") }}
{{- if and $cert (not (hasKey $seen $key)) }}
{{- $_ := set $seen $key true }}
---
apiVersion: {{ $tls.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ include "ingress-gateway.helpers.app.resourceName" (dict "kind" "ExternalSecret" "name" $cert.name "parent" $gatewayName "context" $root) }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "ingress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  refreshInterval: {{ $tls.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $cert.storeName | quote }}
  target:
    name: {{ include "ingress-gateway.helpers.app.tlsSecretName" (dict "name" $cert.name "parent" $gatewayName "context" $root) | quote }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: {{ $cert.path | quote }}
        property: {{ $cert.crtProperty | quote }}
    - secretKey: tls.key
      remoteRef:
        key: {{ $cert.path | quote }}
        property: {{ $cert.keyProperty | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
