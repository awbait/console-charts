# Минимальный пример: один Gateway с HTTP-listener'ом и один HTTPRoute,
# плюс NetworkPolicy и AuthorizationPolicy для workload'а шлюза.
#
# Имена ресурсов по конвенции: {instance}-{cluster}-{kindShort}-{project}-{name}
# С тегами ниже получится:
# - Gateway             ed-dev-igw-nbox-main
# - ConfigMap           ed-dev-cm-nbox-main
# - NetworkPolicy       ed-dev-np-nbox-main
# - AuthorizationPolicy ed-dev-ap-nbox-main
# - HTTPRoute           ed-dev-hr-nbox-app

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}
  annotations: {}

authorizationPolicy:
  enabled: true

networkPolicy:
  enabled: true
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: app
      ports:
        - port: 80
          protocol: TCP

gateways:
  - name: main
    enabled: true
    listeners:
      - name: http
        port: 80
        protocol: HTTP
        hostname: example.test.ru

xroutes:
  - name: app
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - gateway: main
        sectionName: http
    hostnames:
      - example.test.ru
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: nginx-service
            port: 80
            namespace: demo-core-test
