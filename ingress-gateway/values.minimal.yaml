# Минимальный пример: один Gateway с HTTP-listener'ом и один HTTPRoute,
# плюс политики: NetworkPolicy и AuthorizationPolicy для workload'а шлюза и
# ещё по одной в namespace сервиса назначения.
#
# Имена ресурсов по конвенции: {instance}-{cluster}-{kindShort}-{project}-{name}
# С тегами ниже получится:
# - Gateway             ed-dev-igw-nbox-main
# - ConfigMap           ed-dev-cm-nbox-main
# - NetworkPolicy       ed-dev-np-nbox-main
# - AuthorizationPolicy ed-dev-ap-nbox-main
# - HTTPRoute           ed-dev-hr-main-nbox-app
# - ReferenceGrant      ed-dev-rg-main-nbox-routes   (в demo-core-test)
# - NetworkPolicy       ed-dev-np-main-nbox-routes   (в demo-core-test)
# - AuthorizationPolicy ed-dev-ap-main-nbox-routes   (в demo-core-test)

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}
  annotations: {}

# Один переключатель: NetworkPolicy и AuthorizationPolicy точки входа, а для
# сервиса в другом namespace (demo-core-test ниже) ещё NetworkPolicy и
# AuthorizationPolicy в том namespace. Правила выводятся из маршрутов.
policies:
  enabled: true

gateways:
  - name: main
    enabled: true
    listeners:
      - name: http
        port: 80
        protocol: HTTP
        hostname: example.test.ru

xroutes:
  - name: app
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - gateway: main
        sectionName: http
    hostnames:
      - example.test.ru
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: nginx-service
            port: 80
            namespace: demo-core-test
