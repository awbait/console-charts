# Безопасные пустые дефолты. Чарт подхватывает этот файл при каждом рендере,
# поэтому здесь не должно быть примеров gateways/xroutes: они подмешались бы в
# любой заказ, где эти ключи не заданы. Полный справочник с пояснениями -
# values.full.yaml. Заказ приносит свои значения; блок identity обязателен
# (проверяется через values.schema.json).
generic:
  labels: {}
  annotations: {}

# Необязательные секции по умолчанию выключены - заказ включает только нужное.
authorizationPolicy:
  enabled: false

networkPolicy:
  enabled: false

oidcAuth:
  enabled: false

# Сертификаты для listener'ов с tlsMode: Terminate. По умолчанию сертификат
# на домен точки входа выпускается сам: чарт создаёт Certificate, cert-manager
# подписывает его у платформенного издателя и держит в namespace секрет типа
# kubernetes.io/tls. Записи ниже нужны только там, где сертификат уже есть:
# в хранилище (чарт создаёт ExternalSecret) или прямо в кластере.
tls:
  # Платформенный издатель: у него подписываются сертификаты, которые заказ
  # не принёс сам. Значения платформенные, в форме заказа не показываются.
  issuer:
    # enabled: false выключает автовыпуск целиком. Тогда домен, не покрытый
    # ни одной записью certificates, останавливает рендер, как раньше.
    enabled: true

    # Имя издателя в кластере. Правится один раз при сборке чарта.
    name: platform-ca

    # ClusterIssuer или Issuer в namespace релиза.
    kind: ClusterIssuer

    # Домены, которые издателю разрешено подписывать: роль PKI выпускает
    # только их. Домен из списка покрывает и себя, и всё под ним на любую
    # глубину. Пустой список - чарт не проверяет и отдаёт решение издателю.
    domains: []

  # Хранилище по умолчанию: SecretStore в namespace релиза. Запись сертификата
  # может назвать другое хранилище того же namespace.
  store: vault

  # Как часто перечитывать сертификат из хранилища.
  refreshInterval: 1h

  # Ключи внутри записи хранилища.
  crtProperty: tls.crt
  keyProperty: tls.key

  # Сертификаты, которые заказ приносит с собой: из хранилища или уже готовым
  # секретом. Здесь список пуст, значит домены точек входа получат сертификаты
  # автовыпуском. Домен со звёздочкой покрывает один уровень, ровно как сам
  # сертификат: *.idp.ecpk.test подходит для app.idp.ecpk.test, но не для
  # a.str.idp.ecpk.test.
  certificates: []

# gateways / xroutes намеренно не заданы: их приносит заказ.
# Пример со всеми параметрами - в values.full.yaml.
