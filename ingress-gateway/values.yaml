# Безопасные пустые дефолты. Чарт подхватывает этот файл при каждом рендере,
# поэтому здесь не должно быть примеров gateways/xroutes: они подмешались бы в
# любой заказ, где эти ключи не заданы. Полный справочник с пояснениями -
# values.full.yaml. Заказ приносит свои значения; блок identity обязателен
# (проверяется через values.schema.json).
generic:
  labels: {}
  annotations: {}

# Необязательные секции по умолчанию выключены - заказ включает только нужное.
authorizationPolicy:
  enabled: false

networkPolicy:
  enabled: false

oidcAuth:
  enabled: false

# Платформенные wildcard-сертификаты. Ими наполняется автоматически создаваемый
# секрет listener'а с tlsMode: Terminate, если hostname попадает в домен
# (*.idp.ecpk.test -> *-idptls, *.edp.ecpk.test -> *-edptls). Значения - base64
# tls.crt/tls.key; пусто здесь означает заглушку, которую заполняет платформа.
# Для остальных hostname создаётся пустой секрет "*-tls".
tlsWildcards:
  idp: { crt: "", key: "" }
  edp: { crt: "", key: "" }

# gateways / xroutes намеренно не заданы: их приносит заказ.
# Пример со всеми параметрами - в values.full.yaml.
