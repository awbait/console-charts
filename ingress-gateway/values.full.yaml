# ============================================================================
#  Helm-чарт ingress-gateway - полный справочник значений
#  Здесь перечислены все параметры с описанием. Чарт разворачивает вход в
#  кластер поверх Istio и Gateway API. Секции независимы, можно использовать
#  любое их сочетание:
#
#    gateways[]           - Gateway (Gateway API) и инфраструктурный ConfigMap
#                           (Deployment/Service/HPA создаваемого workload'а).
#    xroutes[]            - маршруты (HTTP/GRPC/TLS/TCP/UDP) до сервисов.
#    networkPolicy        - NetworkPolicy для workload'а каждого Gateway.
#    authorizationPolicy  - AuthorizationPolicy (Istio) для workload'а Gateway.
#    oidcAuth             - вход через OIDC: oauth2-proxy и Keycloak.
#
#  Имя каждого ресурса:
#    {instance}-{cluster}-{kindShort}-{project}-{name}
# ============================================================================


# ----------------------------------------------------------------------------
# identity - теги окружения и проекта (см. схему имени выше)
# ----------------------------------------------------------------------------
# instance / cluster / project задаются один раз на релиз.
# kindShort подставляется автоматически по типу ресурса:
#   igw - Gateway              hr  - HTTPRoute        tr  - TLSRoute
#   cm  - ConfigMap            gr  - GRPCRoute        tcr - TCPRoute
#   np  - NetworkPolicy        ur  - UDPRoute
#   ap  - AuthorizationPolicy
# name задаётся у каждого Gateway и маршрута (DNS-формат): у Gateway 2..9
# символов, у маршрута и сертификата 2..6. У маршрута перед проектом стоит имя
# его гейтвея: {instance}-{cluster}-{kindShort}-{gateway}-{project}-{name}.
#
# Эти же теги проставляются на каждый ресурс чарта как labels:
#   ecpk/instance: <instance>
#   ecpk/cluster:  <cluster>
#   ecpk/project:  <project>
identity:
  # Тег инстанса окружения. Обязателен. Допустимые значения - в README.md.
  instance: ed

  # Тег кластера окружения. Обязателен. Допустимые значения - в README.md.
  cluster: dev

  # Тег проекта. Обязателен. До 9 символов: строчные латинские буквы, цифры
  # и дефис (дефис не может быть первым или последним символом).
  project: nbox

generic:
  # Общие labels для всех ресурсов чарта.
  labels:
    environment: production
    team: platform

  # Общие annotations для всех ресурсов чарта.
  annotations:
    owner: platform-team
    monitoring: "true"


# ============================================================================
# authorizationPolicy - Istio AuthorizationPolicy для workload'а Gateway
# ============================================================================
# enabled: true -> для каждого включённого Gateway создаётся AuthorizationPolicy
# (по умолчанию ALLOW для 0.0.0.0/0). Тонкая настройка правил в разработке.
authorizationPolicy:
  enabled: true


# ============================================================================
# networkPolicy - NetworkPolicy для workload'а Gateway
# ============================================================================
# enabled: true -> для каждого включённого Gateway создаётся NetworkPolicy.
# Входящий трафик по умолчанию разрешён на служебные порты Istio
# (80/443/15020/15021/15090). Секцию egress задаёте вы, при enabled: true
# она обязательна.
networkPolicy:
  enabled: true
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 80
          protocol: TCP

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 1053
          protocol: TCP
        - port: 1053
          protocol: UDP

    # Правило по диапазону адресов, с исключениями.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
            except:
              - 10.40.0.0/16
      ports:
        - port: 443
          protocol: TCP


# ============================================================================
# gateways - список Gateway (на элемент создаётся Gateway и ConfigMap)
# ============================================================================
#   name        - обязательно, 2..9 символов; подставляется в {name} имени
#                 Gateway и ConfigMap, на него ссылается xroutes[].parentRefs[].gateway
#   enabled     - по умолчанию true; false -> Gateway и ConfigMap не создаются
#   ipAddress   - постоянный адрес LoadBalancer (аннотация MetalLB в ConfigMap)
#   hpa         - HorizontalPodAutoscaler для создаваемого Deployment
#   resources   - ресурсы контейнера istio-proxy (ConfigMap.data.deployment)
#   listeners[] - список listener'ов:
#     name          - имя listener'а (sectionName в parentRefs), длина не ограничена
#     port/protocol - обязательны (HTTP/HTTPS/TCP/UDP/TLS)
#     hostname      - обязателен для HTTPS и TLS, у TCP и UDP не используется
#     tlsMode       - Terminate (по умолчанию для HTTPS) | Passthrough (для TLS)
#     certificateRefs - готовый секрет с сертификатом, если он уже лежит
#                     в кластере под своим именем (см. секцию tls ниже)
#     allowedRoutes - какие маршруты listener принимает
#
# Сертификат для tlsMode: Terminate ищется по hostname в секции tls: сначала
# в tls.certificates заказа, потом в платформенных tls.platform. Если ни один
# домен не покрывает hostname, рендер падает и называет этот hostname.
gateways:
  - name: main
    enabled: true

    ipAddress: 127.0.0.1

    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      averageUtilization: 80

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    listeners:
      - name: http
        port: 80
        protocol: HTTP
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: HTTPRoute

      # Сертификат берётся из записи tls.certificates с доменом *.example.ru
      # (см. секцию tls ниже): секрет id-dev-secret-nbox-web.
      - name: https
        port: 443
        protocol: HTTPS
        hostname: app.example.ru
        tlsMode: Terminate
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: HTTPRoute
            - kind: GRPCRoute

      # Тот же домен *.example.ru, значит и тот же секрет: ExternalSecret
      # создаётся один на сертификат, а не на listener.
      - name: grpc
        port: 8443
        protocol: HTTPS
        hostname: grpc.example.ru
        tlsMode: Terminate
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: GRPCRoute

      # Платформенный домен: сертификат приготовлен заранее, в заказе про него
      # писать не нужно (tls.platform).
      - name: idp
        port: 8444
        protocol: HTTPS
        hostname: "*.idp.ecpk.test"
        tlsMode: Terminate
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: HTTPRoute

      # certificateRefs - явные ссылки на секреты с сертификатом, если он уже
      # лежит в кластере под своим именем. Тогда чарт для этого listener'а
      # ExternalSecret не создаёт.
      - name: ext
        port: 8445
        protocol: HTTPS
        hostname: ext.example.ru
        tlsMode: Terminate
        certificateRefs:
          - name: ext-example-ru-tls
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: HTTPRoute

      - name: tls-kf
        port: 9443
        protocol: TLS
        hostname: kafka.example.ru
        tlsMode: Passthrough
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: TLSRoute

      - name: tcp-pg
        port: 5432
        protocol: TCP
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: TCPRoute

      - name: udp-dns
        port: 1053
        protocol: UDP
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: UDPRoute

  - name: intnl
    enabled: true
    listeners:
      - name: http-int
        port: 8080
        protocol: HTTP
        hostname: gtw-test2.example.test
        allowedRoutes:
          namespaces:
            from: Same
          kinds:
            - kind: HTTPRoute


# ============================================================================
# xroutes - список маршрутов (тип задаётся в kind, apiVersion выбирается сам)
# ============================================================================
#   name         - обязательно, 2..6 символов; подставляется в {name} имени маршрута
#   enabled      - по умолчанию true
#   kind         - HTTPRoute (по умолчанию) | GRPCRoute | TLSRoute | TCPRoute | UDPRoute
#   parentRefs[] - gateway (= gateways[].name) и sectionName (= listener.name)
#   hostnames[]  - для HTTP, GRPC и TLS (у TLS это SNI)
#   rules[]      - matches и filters только для HTTP и GRPC; backendRefs обязателен
#                  (name и port; namespace и weight - по желанию)
#
# Если включённый Gateway один, часть полей можно не писать (в этом примере их
# два, поэтому gateway указан явно):
#   - parentRefs[].gateway - подставится имя единственного Gateway;
#   - hostnames - возьмутся из listener'а по parentRefs[].sectionName.
xroutes:
  - name: app
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - gateway: main
        sectionName: http
      - gateway: main
        sectionName: https
    hostnames:
      - app.example.ru
      - www.app.example.ru
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              add:
                - name: x-routed-by
                  value: gateway-chart
        backendRefs:
          - name: app
            port: 80
            weight: 100
      - matches:
          - path:
              type: PathPrefix
              value: /api
        backendRefs:
          - name: api
            port: 8080
            weight: 100

  - name: ugrpc
    enabled: true
    kind: GRPCRoute
    parentRefs:
      - gateway: main
        sectionName: grpc
    hostnames:
      - grpc.example.ru
    rules:
      - matches:
          - method:
              service: users.UsersService
              method: GetUser
        backendRefs:
          - name: users-grpc
            port: 9090
            weight: 100

  - name: kafka
    enabled: true
    kind: TLSRoute
    parentRefs:
      - gateway: main
        sectionName: tls-kf
    hostnames:
      - kafka.example.ru
    rules:
      - backendRefs:
          - name: kafka
            port: 9093
            weight: 100

  - name: pg
    enabled: true
    kind: TCPRoute
    parentRefs:
      - gateway: main
        sectionName: tcp-pg
    rules:
      - backendRefs:
          - name: postgres
            port: 5432
            weight: 100

  - name: dns
    enabled: true
    kind: UDPRoute
    parentRefs:
      - gateway: main
        sectionName: udp-dns
    rules:
      - backendRefs:
          - name: dns-service
            port: 1053
            weight: 100

  - # Маршрут-витрина: остальные формы условий и фильтров. На один фильтр
    # приходится один параметр, поэтому фильтры перечисляются списком.
    name: filt
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - gateway: main
        sectionName: https
    hostnames:
      - filters.example.ru
    rules:
      # Условия по заголовкам и по параметрам адреса.
      - matches:
          - headers:
              - type: Exact
                name: x-tenant
                value: gold
          - queryParams:
              - type: RegularExpression
                name: debug
                value: "^(1|true)$"
        filters:
          - type: RequestHeaderModifier
            requestHeaderModifier:
              set:
                - name: x-tenant
                  value: gold
          - type: RequestHeaderModifier
            requestHeaderModifier:
              remove:
                - x-internal-debug
        backendRefs:
          - name: app
            port: 80
            weight: 100

      # Перенаправление: на фильтр меняется одна часть адреса.
      - matches:
          - path:
              type: PathPrefix
              value: /old
        filters:
          - type: RequestRedirect
            requestRedirect:
              scheme: https
          - type: RequestRedirect
            requestRedirect:
              hostname: new.example.ru
          - type: RequestRedirect
            requestRedirect:
              port: 8443
          - type: RequestRedirect
            requestRedirect:
              statusCode: 301
          - type: RequestRedirect
            requestRedirect:
              path:
                type: ReplaceFullPath
                replaceFullPath: /new
        backendRefs:
          - name: app
            port: 80
            weight: 100

      # Подмена адреса перед отправкой в сервис.
      - matches:
          - path:
              type: PathPrefix
              value: /shop
        filters:
          - type: URLRewrite
            urlRewrite:
              hostname: internal.example.ru
          - type: URLRewrite
            urlRewrite:
              path:
                type: ReplaceFullPath
                replaceFullPath: /
        backendRefs:
          - name: shop
            port: 8080
            weight: 100

      # CORS: доступ к сервису из браузера с другого домена.
      - matches:
          - path:
              type: PathPrefix
              value: /public-api
        filters:
          - type: CORS
            cors:
              allowOrigins:
                - https://example.ru
          - type: CORS
            cors:
              allowCredentials: true
          - type: CORS
            cors:
              allowMethods:
                - GET
                - POST
          - type: CORS
            cors:
              allowHeaders:
                - authorization
          - type: CORS
            cors:
              exposeHeaders:
                - x-request-id
          - type: CORS
            cors:
              maxAge: 600
        backendRefs:
          - name: public-api
            port: 8080
            weight: 100

  - name: intapp
    enabled: true
    kind: HTTPRoute
    parentRefs:
      - gateway: intnl
        sectionName: http-int
    hostnames:
      - gtw-test2.example.test
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: nginx-service
            port: 80
            namespace: demo-core-test


# ============================================================================
# oidcAuth - вход через OIDC: oauth2-proxy и Keycloak
# ============================================================================
# По умолчанию выключено. Имена ресурсов задаются вручную и не следуют
# 5-частной конвенции (будет доработано). При enabled: true обязательны:
# application, gateway, groupsPolicy.allowedGroups, keycloak.issuer и
# keycloak.jwksUri.
oidcAuth:
  enabled: false

  application:
    namespace: sm-netbox-core
    hostnames:
      - sm-netbox.idp.ecpk.test

  gateway:
    name: gateway-main
    namespace: sm-netbox-ingress
    sectionName: https

  oauth2Route:
    name: oauth2-proxy-route
    pathPrefix: /oauth2

  oauth2Proxy:
    service:
      weight: 100

  referenceGrant:
    name: allow-netbox-to-oauth2proxy

  externalAuthPolicy:
    name: redirect-to-oauth2-proxy
    notPaths:
      - /oauth2/*

  groupsPolicy:
    name: groups-whitelist
    publicPaths:
      - /oauth2/*
    claimKey: request.auth.claims[groups]
    allowedGroups:
      - demo_dev_core_admin

  requestAuthentication:
    name: keycloak-jwt
    forwardOriginalToken: true

  keycloak:
    issuer: https://kc.idp.ecpk.test/realms/ecpk-dev
    jwksUri: https://kc.idp.ecpk.test/realms/ecpk-dev/protocol/openid-connect/certs


# ============================================================================
# tls - откуда берутся сертификаты для listener'ов с tlsMode: Terminate
# ============================================================================
# Сертификат и ключ лежат в Vault. На каждый использованный сертификат чарт
# создаёт ExternalSecret, а External Secrets Operator держит в namespace секрет
# kubernetes.io/tls с этим сертификатом. В values едет только путь: ни ключ, ни
# сам сертификат в репозиторий заказа не попадают.
#
# Как выбирается сертификат для listener'а: по его hostname, сначала среди
# tls.certificates заказа, потом среди платформенных tls.platform. Домен со
# звёздочкой покрывает один уровень, ровно как сам сертификат: *.example.ru
# подходит для app.example.ru и для *.example.ru, но не для a.b.example.ru.
# Если ни один домен не покрывает hostname, рендер падает и называет hostname.
#
# Имена ресурсов собираются из name записи:
#   секрет         {instance}-{cluster}-secret-{project}-{name}
#   ExternalSecret {instance}-{cluster}-es-{project}-{name}
tls:
  # Хранилище по умолчанию: имя SecretStore в namespace релиза. Берётся, когда
  # у записи не задано своё. В форме скрыто, хранилище выбирается у записи.
  store: vault

  # Как часто перечитывать сертификат из хранилища.
  refreshInterval: 1h

  # Ключи внутри записи хранилища.
  crtProperty: tls.crt
  keyProperty: tls.key

  # apiVersion ресурса ExternalSecret. Задаётся, если в кластере стоит
  # External Secrets Operator старой версии (external-secrets.io/v1beta1).
  apiVersion: external-secrets.io/v1

  # Платформенные сертификаты. Приезжают вместе с чартом, заказ про них
  # ничего не пишет, в форме секция скрыта. Хранилище названо явно, чтобы
  # выбор хранилища в заказе не уводил их в чужой SecretStore.
  platform:
    - name: idptls
      domain: "*.idp.ecpk.test"
      path: platform/certs/idp-ecpk-test
      store: vault
    - name: edptls
      domain: "*.edp.ecpk.test"
      path: platform/certs/edp-ecpk-test
      store: vault

  # Свои сертификаты: любой домен, любого уровня, в том числе вне ecpk.test.
  certificates:
    # Хранилище не задано - берётся tls.store, то есть SecretStore vault
    # в namespace релиза.
    - name: web
      domain: "*.example.ru"
      path: teams/nbox/certs/example-ru

    # Другое хранилище того же namespace, если сертификаты команды лежат
    # не там же, где остальные. crtProperty и keyProperty задаются, если
    # внутри записи Vault ключи названы иначе.
    - name: str
      domain: "*.str.idp.ecpk.test"
      path: teams/nbox/certs/str
      store: vault-nbox
      crtProperty: certificate
      keyProperty: private_key


# ============================================================================
# Служебные секции: в форме портала скрыты
# ============================================================================

# global - глобальные значения Helm. Инжектятся автоматически, когда чарт
# подключён сабчартом. Шаблоны чарта их не используют.
global: {}

# enabled - флаг condition родительского чарта. Шаблоны его не используют.
enabled: true
