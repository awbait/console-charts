# ============================================================================
#  Helm-чарт secret-store - полный справочник значений
#  Чарт открывает namespace доступ к секретам StarVault. Он создаёт два
#  ресурса и ни одного секрета:
#
#    ServiceAccount - от его имени External Secrets Operator логинится
#                     в StarVault;
#    SecretStore    - адрес StarVault, движок KV и способ авторизации.
#
#  Дальше секреты забирают другие заказы: ExternalSecret ссылается на этот
#  SecretStore по имени и кладёт значение в обычный Secret кластера.
# ============================================================================


# ----------------------------------------------------------------------------
# identity - теги окружения и проекта
# ----------------------------------------------------------------------------
# В имена ресурсов эти теги не входят: имена заданы явно (см. ниже). Теги
# проставляются на ресурсы как labels ecpk/instance, ecpk/cluster, ecpk/project,
# по ним ресурсы находятся в кластере.
identity:
  # Тег инстанса окружения. Обязателен. Допустимые значения - в README.md.
  instance: ed

  # Тег кластера окружения. Обязателен. Допустимые значения - в README.md.
  cluster: dev

  # Тег проекта. Обязателен. До 9 символов: строчные латинские буквы, цифры
  # и дефис (дефис не может быть первым или последним символом).
  project: nbox

generic:
  # Общие labels для всех ресурсов чарта.
  labels:
    team: platform

  # Общие annotations для всех ресурсов чарта.
  annotations:
    owner: platform-team


# ============================================================================
# serviceAccount - от чьего имени ходить в StarVault
# ============================================================================
# ESO приходит в StarVault с токеном этого аккаунта. Имя по умолчанию -
# external-secrets-<имя хранилища>, поэтому два хранилища в одном namespace
# не делят один аккаунт. Имя не собирается из тегов окружения: если роль в
# StarVault когда-нибудь снова начнут привязывать к имени аккаунта, оно должно
# оставаться предсказуемым.
#   create - false, если аккаунт уже заведён кем-то другим
#   name   - задай, чтобы прибить имя вручную
serviceAccount:
  create: true


# ============================================================================
# store - сам SecretStore
# ============================================================================
store:
  # Имя ресурса в namespace. На него ссылаются другие заказы: у сертификата
  # в ingress-gateway это поле "Хранилище". Второе хранилище в том же
  # пространстве назови иначе: имя занято на пару (namespace, kind).
  name: vault

  # Адрес StarVault. Платформенное значение, зависит от кластера.
  server: "https://vault.idp.ecpk.test"

  # Движок KV: имя mount'а и версия. Имя заполняет заказчик, оно видно в форме.
  # От версии зависит вид пути в записях: для v2 путь пишется без data/, ESO
  # подставляет его сам.
  path: kv
  version: v2

  auth:
    # Имя mount'а метода аутентификации, без префикса auth/. Логин уходит
    # на auth/<mountPath>/login.
    mountPath: kubernetes_global

    # Роль в StarVault. Обязательна: без неё релиз не соберётся. Обычно
    # совпадает с именем команды.
    role: core

  # Сертификат УЦ, которым подписан StarVault. Нужен, если кластер этому УЦ
  # не доверяет. Либо base64 PEM здесь:
  caBundle: ""

  # ...либо ссылка на ConfigMap или Secret с сертификатом:
  caProvider: {}
  # caProvider:
  #   type: ConfigMap
  #   name: starvault-ca
  #   key: ca.crt
  #   namespace: external-secrets

  # apiVersion ресурса SecretStore. Меняется, если в кластере стоит
  # External Secrets Operator старой версии (external-secrets.io/v1beta1).
  apiVersion: external-secrets.io/v1

# ----------------------------------------------------------------------------
# Служебные поля
# ----------------------------------------------------------------------------
# global - глобальные значения Helm. Инжектятся автоматически, когда чарт
# подключён сабчартом. Шаблоны чарта их не используют.
global: {}

# enabled - главный выключатель чарта. false -> не создаётся ни один ресурс.
# По умолчанию true, поэтому заказ из портала и обычный helm install создают
# ресурсы сразу. Ставь false, если чарт подключён сабчартом и должен молчать.
enabled: true
