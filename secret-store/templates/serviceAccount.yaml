{{/*
ServiceAccount the External Secrets Operator authenticates as when it reads
secrets from StarVault. The role in StarVault is bound to this pair of
(namespace, ServiceAccount name), which is why the name is the same in every
namespace and does not follow the 5-part naming convention.
Set serviceAccount.create: false when the account is already there.
*/}}
{{- if eq (include "secret-store.helpers.chartEnabled" .) "true" }}
{{- if (.Values.serviceAccount | default dict).create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "secret-store.helpers.app.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
  {{- include "secret-store.helpers.app.metadata" (dict "context" $) | nindent 2 }}
{{- end }}
{{- end }}
