{{/*
ExternalSecret resources read named values from StarVault through the chart's
SecretStore and materialize Kubernetes Secrets.
*/}}
{{- if eq (include "secret-store.helpers.chartEnabled" .) "true" }}
{{- $root := . -}}
{{- $store := $root.Values.store | default dict -}}
{{- $storeName := include "secret-store.helpers.storeName" $root -}}
{{- $names := dict -}}
{{- range $index, $secret := $root.Values.secrets | default list }}
{{- $name := include "secret-store.helpers.secret.validate" (dict "entry" $secret "index" $index) -}}
{{- $data := list -}}
{{- $dataFrom := list -}}
{{- range $vaultSecret := $secret.vaultSecrets }}
{{- if $vaultSecret.keys }}
{{- range $key := $vaultSecret.keys }}
{{- $data = append $data (dict "secretKey" ($key.secretKey | default $key.vaultKey) "remoteRef" (dict "key" $vaultSecret.vaultSecretPath "property" $key.vaultKey)) -}}
{{- end }}
{{- else }}
{{- $dataFrom = append $dataFrom (dict "extract" (dict "key" $vaultSecret.vaultSecretPath)) -}}
{{- end }}
{{- end }}
{{- if hasKey $names $name -}}
{{- fail (printf "secrets[%d].name duplicates %q" $index $name) -}}
{{- end -}}
{{- $_ := set $names $name true -}}
---
apiVersion: {{ $store.apiVersion | default "external-secrets.io/v1" }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "secret-store.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: {{ $storeName | quote }}
    kind: SecretStore
  target:
    name: {{ $name }}
    creationPolicy: Owner
  {{- with $data }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
