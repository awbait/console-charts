{{/*
SecretStore (External Secrets Operator): where the secrets of this namespace
come from and how the operator authenticates there. Holds no secret itself,
only the address of StarVault and the way in.

The name is set in values rather than built from the 5-part convention: other
releases reference it (ingress-gateway takes it as the store of a certificate),
so it must stay short and the same in every namespace.
*/}}
{{- $root := . -}}
{{- $store := $root.Values.store | default dict -}}
{{- $auth := $store.auth | default dict -}}
{{- $storeName := include "secret-store.helpers.app.objectName" (dict "label" "store.name" "value" ($store.name | default "vault")) }}
apiVersion: {{ $store.apiVersion | default "external-secrets.io/v1" }}
kind: SecretStore
metadata:
  name: {{ $storeName }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "secret-store.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  provider:
    vault:
      server: {{ required "store.server is required" $store.server | toString | quote }}
      path: {{ $store.path | default "kv" | quote }}
      version: {{ $store.version | default "v2" | quote }}
      {{- with $store.caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}
      {{- with $store.caProvider }}
      caProvider:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ $auth.mountPath | default "kubernetes" | quote }}
          role: {{ required "store.auth.role is required - the role that StarVault issued to your namespace" $auth.role | toString | quote }}
          serviceAccountRef:
            name: {{ include "secret-store.helpers.app.serviceAccountName" $root | quote }}
