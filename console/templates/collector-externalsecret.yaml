{{/*
The collector's Secret, filled by the External Secrets Operator from Vault. It
holds one value, the Redis connection, and it is the same Redis the portal uses.
*/}}
{{- if .Values.collector.enabled }}
{{- include "console.externalSecret.validate" (dict "component" .Values.collector "name" "collector") -}}
{{- if include "console.externalSecret.enabled" .Values.collector }}
{{- include "console.externalSecret" (dict "root" . "component" .Values.collector "name" "collector") }}
{{- end }}
{{- end }}
