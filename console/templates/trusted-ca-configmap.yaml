{{- if .Values.trustedCA.certs -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "console.trustedCA.configMapName" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
data:
  {{- range $name, $pem := .Values.trustedCA.certs }}
  {{ $name | quote }}: |
    {{- $pem | nindent 4 }}
  {{- end }}
{{- end }}
