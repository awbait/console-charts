{{/*
The portal's Secret, filled by the External Secrets Operator from Vault. The
chart writes no secret in this mode: it says which store to read and which paths
to take, and the operator keeps the Secret the Deployment already mounts.
*/}}
{{- include "console.externalSecret.validate" (dict "component" .Values.portal "name" "portal") -}}
{{- if include "console.externalSecret.enabled" .Values.portal }}
{{- include "console.externalSecret" (dict "root" . "component" .Values.portal "name" "portal") }}
{{- end }}
