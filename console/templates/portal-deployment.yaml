{{- include "console.portal.validateScale" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "console.portal.fullname" . }}
  labels:
    {{- include "console.labels" . | nindent 4 }}
    {{- include "console.portal.selectorLabels" . | nindent 4 }}
spec:
  {{- if not .Values.portal.autoscaling.enabled }}
  {{- /* Under an autoscaler the field is left out on purpose: it belongs to the
         HPA from then on, and setting it here would put the two in a loop,
         Helm writing the value back on every upgrade. */}}
  replicas: {{ .Values.portal.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "console.portal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when the config/secret changes.
        checksum/config: {{ include (print $.Template.BasePath "/portal-configmap.yaml") . | sha256sum }}
        # Both files: one of them is empty, depending on where the secrets come
        # from. What External Secrets later writes into the Secret is not visible
        # here, so a rotated value in Vault does not roll the pods by itself.
        checksum/secret: {{ printf "%s%s"
          (include (print $.Template.BasePath "/portal-secret.yaml") .)
          (include (print $.Template.BasePath "/portal-externalsecret.yaml") .) | sha256sum }}
        {{- if .Values.trustedCA.certs }}
        checksum/trusted-ca: {{ include (print $.Template.BasePath "/trusted-ca-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.portal.metrics.enabled .Values.portal.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.portal.metrics.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
        {{- with .Values.portal.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "console.labels" . | nindent 8 }}
        {{- include "console.portal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "console.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.portal.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: portal
          image: {{ include "console.image" (dict "image" .Values.portal.image "registry" .Values.imageRegistry "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.portal.image.pullPolicy }}
          {{- with .Values.portal.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.portal.service.port }}
              protocol: TCP
            {{- if .Values.portal.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.portal.metrics.port }}
              protocol: TCP
            {{- end }}
          {{- with include "console.componentEnv" (dict "root" . "component" .Values.portal) | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "console.portal.fullname" . }}-config
            - secretRef:
                name: {{ include "console.portal.secretName" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.portal.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or (include "console.trustedCA.enabled" .) .Values.portal.extraVolumeMounts }}
          volumeMounts:
            {{- if include "console.trustedCA.enabled" . }}
            {{- include "console.trustedCA.volumeMount" . | nindent 12 }}
            {{- end }}
            {{- with .Values.portal.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (include "console.trustedCA.enabled" .) .Values.portal.extraVolumes }}
      volumes:
        {{- if include "console.trustedCA.enabled" . }}
        {{- include "console.trustedCA.volume" . | nindent 8 }}
        {{- end }}
        {{- with .Values.portal.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.portal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.portal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.portal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
