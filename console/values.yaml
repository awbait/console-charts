# Значения по умолчанию для чарта console.
# console - один компонент: portal (Go-бэкенд), который слушает :8080 и отдаёт
# и API, и встроенный SPA. Отдельного web/nginx больше нет.

# Префикс реестра для образа (например registry.example.com).
# Пусто - образ тянется как есть (repository:tag).
imageRegistry: ""
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Рантайм Go у портала и коллектора.
goRuntime:
  # Задать GOMAXPROCS по лимиту CPU контейнера. Без этого Go считает себя по
  # числу ядер ноды и на маленьком лимите упирается в троттлинг. Значение берётся
  # через downward API и округляется вверх до целого ядра, поэтому переменная
  # появляется только у компонента, которому лимит CPU задан.
  maxProcsFromLimits: true
  # Задать GOMEMLIMIT долей от лимита памяти контейнера, в процентах. Это мягкий
  # предел: у этой границы сборщик мусора начинает работать чаще и отдаёт память
  # раньше, чем ядро убьёт контейнер по OOM. Считает чарт (downward API умножать
  # не умеет), поэтому переменная появляется только там, где задан лимит памяти.
  # 0 - не задавать GOMEMLIMIT.
  memLimitPercent: 90

# Доверие к собственному удостоверяющему центру. Нужно, когда Keycloak, Argo CD,
# GitLab или Harbor стоят за самоподписанным сертификатом: без корневого
# сертификата портал не пройдёт проверку и упадёт на старте с ошибкой x509.
# Сертификаты монтируются обоим компонентам в /etc/ssl/certs/extra и добавляются
# к публичным корням из образа, а не заменяют их.
#
# Пусто в обоих полях - доверяем только публичным корням. Задавать их можно и
# вместе: сертификаты из них складываются в один каталог.
# Имена файлов при этом должны различаться, иначе под не запустится.
trustedCA:
  # Готовые ConfigMap в том же namespace, сколько нужно. Строка - берутся все
  # ключи объекта под своими именами. Объектом можно выбрать только нужные:
  # в keys слева ключ объекта, справа имя файла в каталоге.
  existingConfigMaps: []
  #  - internal-ca
  #  - name: keycloak-ca
  #    keys:
  #      ca.crt: keycloak-ca.crt
  # То же для Secret: удобно, когда сертификат уже лежит в TLS-секрете.
  # Берите из него только публичную часть - tls.crt. Приватный ключ (tls.key)
  # порталу не нужен: он проверяет чужие сертификаты, а не предъявляет свой.
  existingSecrets: []
  #  - name: keycloak-tls
  #    keys:
  #      tls.crt: keycloak-ca.crt
  # Сертификаты прямо здесь: чарт создаст ConfigMap сам. Ключ - имя файла,
  # значение - PEM; сертификатов может быть сколько угодно.
  certs: {}
  #  internal-root.crt: |
  #    -----BEGIN CERTIFICATE-----
  #    ...
  #    -----END CERTIFICATE-----
  #  keycloak-ca.crt: |
  #    -----BEGIN CERTIFICATE-----
  #    ...
  #    -----END CERTIFICATE-----

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Portal: API + встроенный SPA.
portal:
  # Сколько реплик держать, когда autoscaling выключен. Больше одной требует
  # config.CACHE=redis (см. autoscaling ниже) - иначе рендер падает.
  replicaCount: 1
  # Горизонтальное масштабирование портала.
  #
  # Реплики договариваются через Redis: события, которыми живут открытые
  # страницы, ходят через него, и там же лежит аренда, по которой фоновые циклы
  # (сверка заказов, обновление счётчиков) ведёт ровно одна реплика. Поэтому и
  # HPA, и replicaCount больше единицы требуют config.CACHE=redis, а с
  # config.CACHE=memory рендер падает с объяснением.
  #
  # Нужен портал 0.10.0 и новее: в более ранних сборках фоновые циклы работали
  # бы в каждой реплике параллельно.
  #
  # HPA считает загрузку долей от resources.requests, поэтому метрика без
  # соответствующего request тоже роняет рендер. Пустое значение метрики -
  # она не добавляется, но хотя бы одна нужна.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
    # Политики масштабирования (spec.behavior HPA), как в манифесте. Пусто -
    # поведение по умолчанию.
    behavior: {}
    # behavior:
    #   scaleDown:
    #     stabilizationWindowSeconds: 300
  image:
    # Образ портала: {imageRegistry}/console/portal. imageRegistry задаёт префикс
    # реестра (например ghcr.io/awbait).
    repository: console/portal
    # тег по умолчанию = .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  # Prometheus-метрики отдаются на отдельном порту (config METRICS_PORT ниже).
  # enabled добавляет порт в Service и containerPort; scrapeAnnotations проставляет
  # на под prometheus.io/* (скрейп без ServiceMonitor). port должен совпадать с
  # config METRICS_PORT.
  metrics:
    enabled: true
    port: 2112
    scrapeAnnotations: true
  # Запас на обычную работу: портал держит пул соединений к Postgres
  # (DATABASE_MAX_CONNS), отдаёт SPA из памяти образа и кэширует прочитанные
  # чарты Harbor. По этим лимитам чарт заодно считает GOMAXPROCS и GOMEMLIMIT
  # (см. goRuntime выше). Под большой каталог поднимайте память первой.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}

  # Дополнительные тома и их точки монтирования. Пишутся так же, как в манифесте
  # пода. Для корневого сертификата внутреннего УЦ это не нужно - есть trustedCA
  # выше.
  extraVolumes: []
  # - name: custom-config
  #   configMap:
  #     name: custom-config
  extraVolumeMounts: []
  # - name: custom-config
  #   mountPath: /etc/console
  #   readOnly: true

  # Дополнительные переменные окружения - для тех случаев, когда значение берётся
  # не из config/secrets, а из чужого Secret или из полей пода. Список name/value
  # или name/valueFrom, как в манифесте пода.
  extraEnv: []
  # - name: DATABASE_URL
  #   valueFrom:
  #     secretKeyRef:
  #       name: postgres-app
  #       key: uri

  # Несекретные переменные окружения портала. Ключи совпадают с env-тегами в
  # internal/config/config.go репозитория console. Пустые значения не рендерятся
  # (применяется дефолт из config.go). Полный список с описаниями - в .env.example
  # того же репозитория.
  #
  # Переменные, помеченные ниже как обязательные, портал требует на старте
  # (required,notEmpty в config.go): без них под не поднимется.
  config:
    HTTP_PORT: "8080"
    PUBLIC_URL: "https://console.example.com"
    # Хранилища: postgres|memory, redis|memory.
    STORE: postgres
    CACHE: redis
    # Аутентификация: только oidc (единственный валидный режим).
    AUTH_MODE: oidc
    OIDC_ISSUER: "https://keycloak.example.com/realms/internal"
    OIDC_CLIENT_ID: portal
    OIDC_REDIRECT_URL: "https://console.example.com/api/v1/auth/callback"
    OIDC_SCOPES: "openid,profile,email,groups"
    OIDC_POST_LOGIN_REDIRECT: "/"
    # Куда браузер уходит после выхода. Адрес должен быть зарегистрирован на
    # клиенте как post-logout; пусто - используется адрес входа.
    OIDC_POST_LOGOUT_REDIRECT: ""
    # RBAC: группы Keycloak для ролей.
    RBAC_ADMIN_GROUPS: platform-admins
    RBAC_SUPPORT_GROUPS: support
    RBAC_SECURITY_GROUPS: security
    RBAC_TEAM_GROUP_PREFIX: team-
    # Выражение, первая группа захвата которого - имя команды. Если задано,
    # используется вместо префикса: пример "(?:^|/)team-([^/]+)".
    RBAC_TEAM_GROUP_REGEX: ""
    # Harbor. HARBOR_URL обязателен.
    HARBOR_URL: ""
    # Проекты Harbor, из которых собирается каталог.
    HARBOR_PROJECTS: "platform,managed-services"
    # Пропустить проверку сертификата Harbor - для стендов с самоподписанным.
    HARBOR_INSECURE_TLS: "false"
    HARBOR_TIMEOUT: "30s"
    # GitLab. GITLAB_URL обязателен.
    GITLAB_URL: ""
    GITLAB_TIMEOUT: "30s"
    # GitOps: группа, шаблон подгруппы команды, ветка, автомерж MR портала.
    GITLAB_GITOPS_GROUP: managed-services
    GITLAB_TEAM_SUBGROUP_TEMPLATE: "team-{{.Team}}"
    # Имя папки заказанного сервиса внутри репозитория, под папкой кластера.
    # Пусто - имя сервиса. Доступны .Team, .Chart, .ServiceName, .Namespace,
    # .Cluster. Заказ остаётся в своей папке: изменение действует на новые.
    GITLAB_INSTANCE_DIR_TEMPLATE: ""
    # Заводить подгруппу команды при первом заказе. Требует роли Owner на группе
    # GITLAB_GITOPS_GROUP. Выключите, если подгруппы создаёт кто-то другой.
    GITLAB_CREATE_TEAM_SUBGROUP: "true"
    GITLAB_DEFAULT_BRANCH: main
    GITLAB_AUTO_MERGE: "false"
    # Адрес портала, каким его видит GitLab. Пусто - вебхук заводят руками.
    GITLAB_WEBHOOK_URL: ""
    # Где регистрируется вебхук: auto|group|system|project.
    GITLAB_WEBHOOK_SCOPE: auto
    # ArgoCD. ARGOCD_URL обязателен.
    ARGOCD_URL: ""
    ARGOCD_PROJECT: portal-managed
    # Namespace, в котором работает Argo CD. Портал пишет его в metadata.namespace
    # каждого application.yaml: Application из чужого namespace Argo CD не читает.
    ARGOCD_NAMESPACE: argocd
    ARGOCD_DEFAULT_CLUSTER: in-cluster
    ARGOCD_APP_NAME_TEMPLATE: "{{.Team}}-{{.Chart}}-{{.ServiceName}}"
    # OCI-эндпоинт Harbor. Хост должен резолвиться и из подов портала, и из
    # подов ArgoCD.
    CHART_REGISTRY: "harbor.example.com"
    # Режим обновления состояния: hybrid|webhook. Других значений нет.
    STATUS_UPDATE_MODE: hybrid
    STATUS_POLL_INTERVAL: "15s"
    # Флаги каталога и дрейфа.
    DRIFT_DETECTION_ENABLED: "true"
    IMPORT_DISCOVERY_ENABLED: "false"
    CATALOG_AUTODISCOVER: "false"
    # База данных: сколько соединений держать открытыми одновременно.
    DATABASE_MAX_CONNS: "20"
    # Наблюдаемость. Порт метрик должен совпадать с portal.metrics.port выше.
    # GRAFANA_URL - базовый адрес Grafana, пусто - ссылки на неё нет.
    METRICS_PORT: "2112"
    GRAFANA_URL: ""
    LOG_LEVEL: info
    LOG_FORMAT: json
    # Сессии и cookie.
    SESSION_TTL: "24h"
    SESSION_COOKIE_NAME: idp_session
    COOKIE_SECURE: "true"

  # Откуда портал берёт секреты. Три способа, взаимоисключающие:
  #
  # 1. secrets ниже - значения лежат в values, чарт создаёт из них Secret.
  # 2. existingSecret - Secret создан заранее кем-то другим, чарт его только
  #    монтирует, а secrets игнорируются.
  # 3. externalSecret - Secret наполняет External Secrets Operator из Vault.
  #    Чарт при этом не хранит ни одного секрета: только адрес хранилища и то,
  #    какие пути из него читать.
  #
  # Задать одновременно existingSecret и externalSecret нельзя - рендер падает.
  #
  # GITLAB_TOKEN и ARGOCD_TOKEN обязательны: без них портал не стартует.
  existingSecret: ""

  # Секреты из Vault через External Secrets Operator.
  #
  # Оператор создаёт и держит в актуальном состоянии тот же Secret, который
  # монтирует Deployment портала. Нужен установленный в кластере External
  # Secrets Operator и SecretStore, знающий дорогу в Vault: его создаёт чарт
  # secret-store из этого же репозитория (по умолчанию с именем vault).
  #
  # Ключи Secret должны называться так же, как переменные в secrets ниже:
  # DATABASE_URL, SESSION_SECRET, GITLAB_TOKEN и остальные.
  #
  # Чем заполнять, задаётся полями dataFrom и data - это поля самого
  # ExternalSecret, без переименований. Нужно хотя бы одно из них, иначе
  # оператор создаст пустой Secret, а портал не стартует - поэтому рендер
  # падает раньше.
  #
  # Ротация значения в Vault сама по себе поды не перезапускает: Secret
  # обновится, а процесс читает переменные окружения один раз, при старте.
  externalSecret:
    enabled: false
    apiVersion: external-secrets.io/v1
    # SecretStore, из которого читаем. kind: ClusterSecretStore, если хранилище
    # общее на кластер, а не заведено в этом namespace.
    secretStoreRef:
      name: vault
      kind: SecretStore
    # Как часто оператор перечитывает значения.
    refreshInterval: 1h
    # Owner - Secret живёт вместе с ExternalSecret и удаляется вместе с ним.
    creationPolicy: Owner
    # Забрать все ключи пути целиком: имена ключей в Vault уже совпадают с
    # именами переменных.
    dataFrom: []
    # - extract:
    #     key: console/portal
    # Забрать по одному, когда имена в Vault свои.
    data: []
    # - secretKey: GITLAB_TOKEN
    #   remoteRef:
    #     key: console/portal
    #     property: gitlab_token
    # Шаблон целевого Secret (spec.target.template), если нужны свои labels,
    # annotations или собранное из нескольких значений поле.
    template: {}

  # Секретные переменные. Рендерятся в Secret (пустые значения пропускаются).
  secrets:
    DATABASE_URL: ""
    REDIS_URL: ""
    SESSION_SECRET: ""
    OIDC_CLIENT_SECRET: ""
    # Робот, под которым портал читает чарты. Пусто - чтение анонимное, что
    # работает только для публичных проектов Harbor.
    HARBOR_ROBOT_USER: ""
    HARBOR_ROBOT_TOKEN: ""
    # То же значение, что в auth-заголовке вебхука на стороне Harbor.
    HARBOR_WEBHOOK_SECRET: ""
    GITLAB_TOKEN: ""
    # То же значение, что в secret token вебхука на стороне GitLab.
    GITLAB_WEBHOOK_TOKEN: ""
    ARGOCD_TOKEN: ""

# Collector: фоновый сбор каталога workload'ов кластера в Valkey/Redis.
# Раз в POLL_INTERVAL обходит namespace по метке, собирает контроллеры
# (Deployment/StatefulSet/DaemonSet) и пишет снимок в Redis; портал читает снимок
# из того же Redis и в Kubernetes API сам не ходит. У коллектора нет HTTP и нет
# метрик - поэтому ни Service, ни проб. enabled=false полностью выключает компонент.
collector:
  enabled: true
  # Держите единицу. Коллектор каждый цикл переписывает снимок целиком, поэтому
  # вторая реплика ничего не ускоряет: она просто во второй раз обходит
  # Kubernetes API и пишет поверх того же снимка.
  replicaCount: 1
  image:
    # Образ коллектора: {imageRegistry}/console/collector.
    repository: console/collector
    # тег по умолчанию = .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent
  # Отдельный ServiceAccount: коллектору нужен read-only RBAC на кластер.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # ClusterRole + ClusterRoleBinding (read-only: namespaces + apps-контроллеры).
  # Выключите create, если права выданы снаружи.
  rbac:
    create: true
  # Коллектор работает раз в POLL_INTERVAL: обходит namespace и пишет снимок в
  # Redis, между обходами почти простаивает. Память растёт с числом контроллеров
  # в кластере.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  # Дополнительные тома, их монтирование и env - как у портала выше.
  extraVolumes: []
  extraVolumeMounts: []
  extraEnv: []
  # Несекретные env (collector/config.go). Пустые значения не рендерятся.
  config:
    # Селектор namespace для обхода (пусто = все namespace).
    NS_LABEL_SELECTOR: "idp.scan=true"
    # Период обхода.
    POLL_INTERVAL: "30s"
    # Имя кластера - входит в префикс ключа снимка в Redis.
    CLUSTER_NAME: default
    # Префикс ключей снимка в Redis.
    KEY_PREFIX: "k8s:catalog"
  # Секреты - те же три способа, что у портала выше.
  # existingSecret (с ключом REDIS_URL) отключает рендер secrets.
  existingSecret: ""
  # Тот же Vault, что у портала. Ключ в Secret должен называться REDIS_URL.
  externalSecret:
    enabled: false
    apiVersion: external-secrets.io/v1
    secretStoreRef:
      name: vault
      kind: SecretStore
    refreshInterval: 1h
    creationPolicy: Owner
    dataFrom: []
    data: []
    # - secretKey: REDIS_URL
    #   remoteRef:
    #     key: console/collector
    #     property: redis_url
    template: {}
  secrets:
    # Подключение к Valkey/Redis (обязательно). Тот же Redis, что у портала.
    REDIS_URL: ""

# Ingress. По умолчанию чарт его не создаёт: вход публикуется снаружи (отдельный
# инстанс ingress-gateway) на Service портала (:8080).
#
# Опционально вход можно поднять прямо из этого чарта - сабчартом ingress-gateway
# (Istio Gateway API). Включение требует Istio + CRD Gateway API в кластере и
# поднимает Gateway + HTTPRoute на Service портала. Значения повторяют чарт
# ingress-gateway (см. charts/ingress-gateway/values.yaml); ниже рабочий пример.
ingressGateway:
  enabled: false
  identity:
    instance: ed
    cluster: dev
    project: cnsl
  gateways:
    - name: main
      enabled: true
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          hostname: console.example.com
  xroutes:
    - name: portal
      enabled: true
      kind: HTTPRoute
      parentRefs:
        - gateway: main
          sectionName: http
      hostnames:
        - console.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            # Имя Service портала: {release}-portal (по умолчанию console-portal).
            - name: console-portal
              port: 8080
