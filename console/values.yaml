# Значения по умолчанию для чарта console.
# console - один компонент: portal (Go-бэкенд), который слушает :8080 и отдаёт
# и API, и встроенный SPA. Отдельного web/nginx больше нет.

# Префикс реестра для образа (например registry.example.com).
# Пусто - образ тянется как есть (repository:tag).
imageRegistry: ""
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Portal: API + встроенный SPA.
portal:
  replicaCount: 1
  image:
    # Образ портала: {imageRegistry}/console/portal. imageRegistry задаёт префикс
    # реестра (например ghcr.io/awbait).
    repository: console/portal
    # тег по умолчанию = .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent
  service:
    port: 8080
  # Prometheus-метрики отдаются на отдельном порту (config METRICS_PORT ниже).
  # enabled добавляет порт в Service и containerPort; scrapeAnnotations проставляет
  # на под prometheus.io/* (скрейп без ServiceMonitor). port должен совпадать с
  # config METRICS_PORT.
  metrics:
    enabled: true
    port: 2112
    scrapeAnnotations: true
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}

  # Несекретные переменные окружения портала. Ключи совпадают с env-тегами в
  # internal/config/config.go репозитория console. Пустые значения не рендерятся
  # (применяется дефолт из config.go). Полный список с описаниями - в .env.example
  # того же репозитория.
  #
  # Переменные, помеченные ниже как обязательные, портал требует на старте
  # (required,notEmpty в config.go): без них под не поднимется.
  config:
    HTTP_PORT: "8080"
    PUBLIC_URL: "https://console.example.com"
    # Хранилища: postgres|memory, redis|memory.
    STORE: postgres
    CACHE: redis
    # Аутентификация: только oidc (единственный валидный режим).
    AUTH_MODE: oidc
    OIDC_ISSUER: "https://keycloak.example.com/realms/internal"
    OIDC_CLIENT_ID: portal
    OIDC_REDIRECT_URL: "https://console.example.com/api/v1/auth/callback"
    OIDC_SCOPES: "openid,profile,email,groups"
    OIDC_POST_LOGIN_REDIRECT: "/"
    # Куда браузер уходит после выхода. Адрес должен быть зарегистрирован на
    # клиенте как post-logout; пусто - используется адрес входа.
    OIDC_POST_LOGOUT_REDIRECT: ""
    # RBAC: группы Keycloak для ролей.
    RBAC_ADMIN_GROUPS: platform-admins
    RBAC_SUPPORT_GROUPS: support
    RBAC_SECURITY_GROUPS: security
    RBAC_TEAM_GROUP_PREFIX: team-
    # Выражение, первая группа захвата которого - имя команды. Если задано,
    # используется вместо префикса: пример "(?:^|/)team-([^/]+)".
    RBAC_TEAM_GROUP_REGEX: ""
    # Harbor. HARBOR_URL обязателен.
    HARBOR_URL: ""
    # Проекты Harbor, из которых собирается каталог.
    HARBOR_PROJECTS: "platform,managed-services"
    # Пропустить проверку сертификата Harbor - для стендов с самоподписанным.
    HARBOR_INSECURE_TLS: "false"
    HARBOR_TIMEOUT: "30s"
    # GitLab. GITLAB_URL обязателен.
    GITLAB_URL: ""
    GITLAB_TIMEOUT: "30s"
    # GitOps: группа, шаблон подгруппы команды, ветка, автомерж MR портала.
    GITLAB_GITOPS_GROUP: managed-services
    GITLAB_TEAM_SUBGROUP_TEMPLATE: "team-{{.Team}}"
    GITLAB_DEFAULT_BRANCH: main
    GITLAB_AUTO_MERGE: "false"
    # Адрес портала, каким его видит GitLab. Пусто - вебхук заводят руками.
    GITLAB_WEBHOOK_URL: ""
    # Где регистрируется вебхук: auto|group|system|project.
    GITLAB_WEBHOOK_SCOPE: auto
    # ArgoCD. ARGOCD_URL обязателен.
    ARGOCD_URL: ""
    ARGOCD_PROJECT: portal-managed
    ARGOCD_DEFAULT_CLUSTER: in-cluster
    ARGOCD_APP_NAME_TEMPLATE: "{{.Team}}-{{.Chart}}-{{.ServiceName}}"
    # OCI-эндпоинт Harbor. Хост должен резолвиться и из подов портала, и из
    # подов ArgoCD.
    CHART_REGISTRY: "harbor.example.com"
    # Режим обновления состояния: hybrid|webhook. Других значений нет.
    STATUS_UPDATE_MODE: hybrid
    STATUS_POLL_INTERVAL: "15s"
    # Флаги каталога и дрейфа.
    DRIFT_DETECTION_ENABLED: "true"
    IMPORT_DISCOVERY_ENABLED: "false"
    CATALOG_AUTODISCOVER: "false"
    # База данных: сколько соединений держать открытыми одновременно.
    DATABASE_MAX_CONNS: "20"
    # Наблюдаемость. Порт метрик должен совпадать с portal.metrics.port выше.
    # GRAFANA_URL - базовый адрес Grafana, пусто - ссылки на неё нет.
    METRICS_PORT: "2112"
    GRAFANA_URL: ""
    LOG_LEVEL: info
    LOG_FORMAT: json
    # Сессии и cookie.
    SESSION_TTL: "24h"
    SESSION_COOKIE_NAME: idp_session
    COOKIE_SECURE: "true"

  # Секретные переменные. Рендерятся в Secret (пустые значения пропускаются).
  # Чтобы использовать заранее созданный Secret - задайте existingSecret, тогда
  # эти значения игнорируются.
  #
  # GITLAB_TOKEN и ARGOCD_TOKEN обязательны: без них портал не стартует.
  existingSecret: ""
  secrets:
    DATABASE_URL: ""
    REDIS_URL: ""
    SESSION_SECRET: ""
    OIDC_CLIENT_SECRET: ""
    # Робот, под которым портал читает чарты. Пусто - чтение анонимное, что
    # работает только для публичных проектов Harbor.
    HARBOR_ROBOT_USER: ""
    HARBOR_ROBOT_TOKEN: ""
    # То же значение, что в auth-заголовке вебхука на стороне Harbor.
    HARBOR_WEBHOOK_SECRET: ""
    GITLAB_TOKEN: ""
    # То же значение, что в secret token вебхука на стороне GitLab.
    GITLAB_WEBHOOK_TOKEN: ""
    ARGOCD_TOKEN: ""

# Collector: фоновый сбор каталога workload'ов кластера в Valkey/Redis.
# Раз в POLL_INTERVAL обходит namespace по метке, собирает контроллеры
# (Deployment/StatefulSet/DaemonSet) и пишет снимок в Redis; портал читает снимок
# из того же Redis и в Kubernetes API сам не ходит. У коллектора нет HTTP и нет
# метрик - поэтому ни Service, ни проб. enabled=false полностью выключает компонент.
collector:
  enabled: true
  replicaCount: 1
  image:
    # Образ коллектора: {imageRegistry}/console/collector.
    repository: console/collector
    # тег по умолчанию = .Chart.AppVersion
    tag: ""
    pullPolicy: IfNotPresent
  # Отдельный ServiceAccount: коллектору нужен read-only RBAC на кластер.
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  # ClusterRole + ClusterRoleBinding (read-only: namespaces + apps-контроллеры).
  # Выключите create, если права выданы снаружи.
  rbac:
    create: true
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podSecurityContext: {}
  securityContext: {}
  # Несекретные env (collector/config.go). Пустые значения не рендерятся.
  config:
    # Селектор namespace для обхода (пусто = все namespace).
    NS_LABEL_SELECTOR: "idp.scan=true"
    # Период обхода.
    POLL_INTERVAL: "30s"
    # Имя кластера - входит в префикс ключа снимка в Redis.
    CLUSTER_NAME: default
    # Префикс ключей снимка в Redis.
    KEY_PREFIX: "k8s:catalog"
  # Секреты. existingSecret (с ключом REDIS_URL) отключает рендер secrets.
  existingSecret: ""
  secrets:
    # Подключение к Valkey/Redis (обязательно). Тот же Redis, что у портала.
    REDIS_URL: ""

# Ingress. По умолчанию чарт его не создаёт: вход публикуется снаружи (отдельный
# инстанс ingress-gateway) на Service портала (:8080).
#
# Опционально вход можно поднять прямо из этого чарта - сабчартом ingress-gateway
# (Istio Gateway API). Включение требует Istio + CRD Gateway API в кластере и
# поднимает Gateway + HTTPRoute на Service портала. Значения повторяют чарт
# ingress-gateway (см. charts/ingress-gateway/values.yaml); ниже рабочий пример.
ingressGateway:
  enabled: false
  identity:
    instance: ed
    cluster: dev
    project: cnsl
  gateways:
    - name: main
      enabled: true
      listeners:
        - name: http
          port: 80
          protocol: HTTP
          hostname: console.example.com
  xroutes:
    - name: portal
      enabled: true
      kind: HTTPRoute
      parentRefs:
        - gateway: main
          sectionName: http
      hostnames:
        - console.example.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            # Имя Service портала: {release}-portal (по умолчанию console-portal).
            - name: console-portal
              port: 8080
