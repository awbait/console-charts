# ============================================================================
#  Helm-чарт subnet - полный справочник значений
#  Создаёт одну подсеть kube-ovn (kubeovn.io/v1 Subnet) на релиз.
#  Namespace и квоты не создаются. Ресурс создаётся только при enabled=true.
# ============================================================================

# Главный выключатель чарта. false - не создаётся ни один ресурс.
# Служебное поле, в форме портала скрыто. В values.yaml выключен, чтобы
# пример CIDR не создавал подсеть без предварительного резервирования.
# Форма заказа включает его через initial в view.schema.json.
enabled: true

# ----------------------------------------------------------------------------
# identity - теги окружения и проекта
# ----------------------------------------------------------------------------
# Все три тега проставляются на Subnet как labels:
#   ecpk/instance: <instance>
#   ecpk/cluster:  <cluster>
#   ecpk/project:  <project>
# Из project и cluster собирается имя: {project}-{cluster}-subnet-{назначение}.
# Когда родитель задаёт global.identity, используется весь этот блок вместо
# identity ниже. Служебная секция, в форме портала скрыта.
identity:
  # Тег инстанса окружения. Допустимые значения заданы в values.schema.json.
  instance: id

  # Тег кластера окружения. Обязателен, DNS-формат.
  cluster: dev

  # Тег проекта. Обязателен, 2..9 символов: строчные латинские буквы,
  # цифры и дефис. Дефис не может быть первым или последним символом.
  project: demo

# ----------------------------------------------------------------------------
# generic - общие labels/annotations на Subnet
# ----------------------------------------------------------------------------
# Служебная секция, в форме портала скрыта. Метки и аннотации добавляются
# единым хелпером subnet.helpers.metadata.
generic:
  # Дополнительные labels. Результат: metadata.labels.
  labels: {}

  # Дополнительные annotations. Результат: metadata.annotations.
  # Annotation argocd.argoproj.io/sync-wave=-2 шаблон добавляет сам.
  annotations: {}

# ----------------------------------------------------------------------------
# subnet - параметры создаваемой подсети kube-ovn
# ----------------------------------------------------------------------------
# Имя, CIDR и список namespace задаются независимо от чарта namespace.
# Шлюз вычисляется из cidrBlock: первый адрес после адреса сети.
# При 10.24.8.0/24 шлюзом будет 10.24.8.1.
subnet:
  # Назначение подсети: последняя часть имени, 2..12 символов, DNS-формат.
  # Для примера ниже получится demo-dev-subnet-app.
  # При изменении параметров существующей подсети сохраняйте её имя и identity.
  name: app

  # Зарезервированный IPv4 CIDR, маска /16../30. Обязательно.
  # Адрес должен совпадать с началом сети: 10.24.8.0/24, а не 10.24.8.1/24.
  # Диапазон не резервируется чартом автоматически.
  cidrBlock: "10.24.8.0/24"

  # NAT исходящего трафика средствами kube-ovn. По умолчанию false:
  # исходящий трафик может обслуживаться отдельным VpcEgressGateway.
  natOutgoing: false

  # Дополнительные адреса, которые нельзя выдавать подам.
  # Один адрес или диапазон start..end, целиком внутри cidrBlock.
  # Адрес шлюза шаблон добавляет сам, даже если список пуст.
  # В манифесте kube-ovn поле называется excludeIps.
  excludeIPs:
    - "10.24.8.2..10.24.8.4"

  # Тип шлюза для исходящего трафика:
  #   distributed - распределённый шлюз, узлы указывать не требуется;
  #   centralized - централизованный шлюз, обязательно заполнить gatewayNodes.
  # По умолчанию distributed, как в актуальном чарте namespace.
  gatewayType: distributed

  # Узлы централизованного шлюза через запятую, например node-a,node-b.
  # Обязательно при gatewayType=centralized. Пустое значение не выводится.
  # В манифесте kube-ovn поле называется gatewayNode.
  # Служебное поле, в форме портала скрыто; задаётся через values.
  gatewayNodes: ""

  # Изоляция подсети средствами kube-ovn. По умолчанию true:
  # связность разрешена только с диапазонами allowSubnets.
  # false - изоляция подсети выключена.
  private: true

  # Дополнительные IPv4 CIDR, с которыми разрешена связность.
  # Service-Subnet 172.30.0.0/15 захардкожена в шаблоне и добавляется всегда.
  # Повтор этого диапазона в списке не создаёт вторую запись в манифесте.
  # Маски разрешённых диапазонов: /0../32.
  allowSubnets:
    - "10.25.0.0/16"

  # Полные имена существующих namespace, привязанных к этой подсети.
  # Пустой список снимает явные привязки. Namespace чарт не создаёт.
  namespaces:
    - demo-dev-ns-app

  # Пользовательская подсеть не является подсетью по умолчанию.
  # Служебное поле, в форме скрыто. Схема допускает только false.
  default: false

  # Протокол подсети. Как в чарте namespace, используется только IPv4.
  # Служебное поле, в форме скрыто. Схема допускает только IPv4.
  protocol: IPv4

  # Балансировка ECMP исходящего трафика выключена.
  # Служебное поле, в форме скрыто. Схема допускает только false.
  enableEcmp: false

# ----------------------------------------------------------------------------
# global - глобальные значения Helm
# ----------------------------------------------------------------------------
# Родитель может передать теги в global.identity: они имеют приоритет над
# identity этого чарта. Собственных выключателей в global нет.
global: {}

# ----------------------------------------------------------------------------
# namespaceBinding - автоматическая привязка при подключении к namespace
# ----------------------------------------------------------------------------
# В самостоятельном чарте выключено: используются subnet.name и namespaces.
# В сабчарте назначение берётся из purpose или global.namespacePurpose,
# полное имя namespace - из namespaceOverride или global.namespaceOverride.
# Пустое subnet.name наследует назначение. subnet.namespaces должен быть пуст.
# Теги родителя и сабчарта согласуйте через global.identity.
namespaceBinding:
  enabled: false             # включить привязку к namespace родителя
  purpose: ""                # переопределение назначения namespace
  namespaceOverride: ""      # полное имя namespace; иначе собирается из тегов
