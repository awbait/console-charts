{{- if eq (include "namespace.helpers.chartEnabled" .) "true" }}
{{ if .Values.subnet.enable }}
{{- $root := . }}
{{- range .Values.subnet.subnets }}
{{- $gatewayIP := include "namespace.helpers.getGatewayIP" .cidrBlock -}}
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: {{ include "namespace.helpers.resourceName" (dict "context" $root "kindShort" "subnet" "name" .name) }}
  {{- include "namespace.helpers.metadata" (dict "context" $root) | nindent 2 }}
spec:
  default: false
  protocol: IPv4
  cidrBlock: {{ .cidrBlock }}
  natOutgoing: false
  excludeIps:   
    - {{ $gatewayIP }}
    {{- if .excludeIps }}
    {{- range .excludeIps }}
    - {{ . }}
    {{- end }}
    {{- end }}
  gateway: {{ $gatewayIP }}
  gatewayType: centralized
  private: true
  allowSubnets:
    - 172.30.0.0/15
    {{- if .allowSubnets }}
    {{- range .allowSubnets }}
    - {{ . }}
    {{- end }}
    {{- end }}
  enableEcmp: false
  namespaces:
    - {{ include "namespace.helpers.namespaceName" $root }}
{{- end }}
{{- end }}
{{- end -}}