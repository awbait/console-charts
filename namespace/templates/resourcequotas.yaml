{{/*
ResourceQuota of the Namespace. The CPU and memory limits are required, as in
the schema: an empty limit used to render as a null value, which the API server
rejects at apply time, long after the render passed. They also stay the source
of requests that are not set, even when the limit itself is lifted.

A flag under resourceQuotas.unlimited lifts one quota: its key is left out of
spec.hard and the value set for it is ignored. With every quota lifted the
ResourceQuota is not rendered at all, since an empty spec.hard limits nothing.
Sync wave -2, alongside the Subnet.
*/}}
{{- if eq (include "namespace.helpers.chartEnabled" .) "true" }}
{{- $quotas := .Values.resourceQuotas | default dict }}
{{- $limits := $quotas.limits | default dict }}
{{- $requests := $quotas.requests | default dict }}
{{- $unlimited := $quotas.unlimited | default dict }}
{{- $unlimitedLimits := $unlimited.limits | default dict }}
{{- $unlimitedRequests := $unlimited.requests | default dict }}
{{- $unlimitedStorage := $unlimited.storage | default dict }}
{{- $cpu := required "resourceQuotas.limits.cpu is required: the CPU limit of the namespace, for example \"4\"" $limits.cpu }}
{{- $memory := required "resourceQuotas.limits.memory is required: the memory limit of the namespace, for example \"8Gi\"" $limits.memory }}
{{- $storageQuotas := dict }}
{{- range $storageClass, $quota := $quotas.storage | default dict }}
{{- if and $quota (not (get $unlimitedStorage $storageClass)) }}
{{- $_ := set $storageQuotas (printf "%s.storageclass.storage.k8s.io/requests.storage" $storageClass) $quota }}
{{- end }}
{{- end }}
{{- $anyQuota := or (not $unlimitedLimits.cpu) (not $unlimitedLimits.memory) (not $unlimited.pods) (not $unlimitedRequests.cpu) (not $unlimitedRequests.memory) (gt (len $storageQuotas) 0) }}
{{- if $anyQuota }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ $quotas.name | default "default" }}
  namespace: {{ include "namespace.helpers.namespaceName" . }}
  {{- include "namespace.helpers.metadata" (dict "context" . "annotations" (include "namespace.helpers.syncWave" "-2" | fromJson)) | nindent 2 }}
spec:
  hard:
    {{- if not $unlimitedLimits.cpu }}
    limits.cpu: {{ $cpu | quote }}
    {{- end }}
    {{- if not $unlimitedLimits.memory }}
    limits.memory: {{ $memory | quote }}
    {{- end }}
    {{- if not $unlimited.pods }}
    pods: {{ $quotas.podsAmount | default 1000 }}
    {{- end }}
    {{- if not $unlimitedRequests.cpu }}
    requests.cpu: {{ $requests.cpu | default $cpu | quote }}
    {{- end }}
    {{- if not $unlimitedRequests.memory }}
    requests.memory: {{ $requests.memory | default $memory | quote }}
    {{- end }}
    {{- if $storageQuotas }}
    {{- $storageQuotas | toYaml | nindent 4 }}
    {{- end }}
{{- end }}
{{- end -}}
