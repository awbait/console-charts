# ============================================================================
#  Helm-чарт namespace - полный справочник значений
#  Создаёт Namespace (cpaas/Alauda), ResourceQuota и подсеть kube-ovn.
#  Ресурсы создаются только при enabled=true.
# ============================================================================

# Главный выключатель чарта. false -> не создаётся ни один ресурс.
# Служебное поле, в форме портала скрыто. По умолчанию true, поэтому заказ из
# портала и обычный helm install создают ресурсы сразу. Ставь false, только
# если чарт подключён сабчартом и должен молчать.
enabled: true

# ----------------------------------------------------------------------------
# identity - теги окружения и проекта
# ----------------------------------------------------------------------------
# Проставляются на каждый ресурс чарта как labels:
#   ecpk/instance: <instance>
#   ecpk/cluster:  <cluster>
#   ecpk/project:  <project>
# Кроме того, project и cluster дают первые две части имени каждого ресурса:
# {project}-{cluster}-ns-{назначение}. В форме заказа секция скрыта: значения
# подставляет портал по окружению, в которое ставится заказ.
identity:
  # Тег инстанса окружения. Обязателен. Допустимые значения - в README.md.
  instance: ed

  # Тег кластера окружения. Обязателен. Допустимые значения - в README.md.
  cluster: dev

  # Тег проекта. Обязателен. До 9 символов: строчные латинские буквы, цифры
  # и дефис (дефис не может быть первым или последним символом).
  project: nbox

# ----------------------------------------------------------------------------
# generic - общие labels/annotations на ВСЕ ресурсы чарта
# (Namespace, ResourceQuota, Subnet). Задаются только глобально;
# в форме портала секция скрыта (ui:widget: hidden).
# ----------------------------------------------------------------------------
generic:
  # Общие labels для всех ресурсов чарта. Результат: metadata.labels.
  labels:
    environment: production
    team: platform

  # Общие annotations для всех ресурсов чарта. Результат: metadata.annotations.
  annotations:
    owner: platform-team
    monitoring: "true"

# ----------------------------------------------------------------------------
# namespace - параметры создаваемого Namespace
# ----------------------------------------------------------------------------
namespace:
  # Назначение namespace: последняя часть имени, 2..12 символов. Обязательно.
  # Полное имя чарт собирает сам: {identity.project}-{identity.cluster}-ns-<name>.
  # Для примера ниже получится nbox-dev-ns-app.
  name: app

  # Отображаемое имя (annotation cpaas.io/display-name).
  displayName: "Managed namespace"

  # Создатель namespace (annotation cpaas.io/creator). По умолчанию "lk".
  # Скрыто в форме портала; при заказе из консоли подставляется "console".
  creator: lk

  # Роль namespace -> label namespace-role. Допустимо: ingress | egress | other.
  # По умолчанию other; в форме заказа поле скрыто.
  role: other

  # Дополнительные annotations на Namespace.
  annotations: {}

  # Дополнительные labels на Namespace.
  labels: {}

# ----------------------------------------------------------------------------
# serviceMesh - подключение Istio (ambient) и сетевых политик
# ----------------------------------------------------------------------------
# Включается на уровне окружения, а не пользователем: на DEV по флагу, на
# остальных окружениях Service Mesh включён всегда. При enabled=true namespace
# получает:
#   labels:     istio-discovery=enabled, istio.io/dataplane-mode=ambient
#   annotation: networking.k8s.io/enable-netpol="true"
serviceMesh:
  enabled: false

# ----------------------------------------------------------------------------
# resourceQuotas - квоты ресурсов namespace
# ----------------------------------------------------------------------------
resourceQuotas:
  # Имя ресурса ResourceQuota. Пусто - "default".
  # Служебное поле, в форме портала скрыто.
  name: default

  # Жёсткие лимиты namespace.
  limits:
    cpu: "4"
    memory: "8Gi"

  # Запросы ресурсов. Не заданы - берутся из лимитов.
  requests:
    cpu: "2"
    memory: "4Gi"

  # Максимальное число подов (на практике ограничено маской подсети).
  # Служебное поле, в форме портала скрыто.
  podsAmount: 1000

  # Квоты на блочные хранилища в формате { <StorageClass>: <квота> }.
  storage:
    storages: {}
    # storages:
    #   fast-ssd: 100Gi

# ----------------------------------------------------------------------------
# subnet - подсети kube-ovn для namespace
# ----------------------------------------------------------------------------
# Часть полей подсети зафиксирована в шаблоне и не настраивается:
#   default=false           - пользовательские подсети никогда не по умолчанию;
#   protocol=IPv4           - тип протокола (IPv6 и Dual не используются);
#   natOutgoing=false       - у изолированной подсети (private=true) NAT выключен;
#   gateway                 - адрес виртуального маршрутизатора, считается из cidrBlock;
#   gatewayType=centralized - тип шлюза для исходящего трафика;
#   private=true            - подсеть изолирована;
#   enableEcmp=false        - балансировка ECMP исходящего трафика выключена;
#   namespaces              - подсеть привязана ровно к одному namespace.
subnet:
  # Включайте, только если CIDR точно зарезервирован в Netbox.
  # Служебное поле, в форме портала скрыто.
  enable: false

  # Список подсетей (при enable=true нужна хотя бы одна).
  subnets:
    - # Назначение подсети: последняя часть имени, 2..12 символов. Обязательно.
      # Полное имя собирается так же, как у namespace: nbox-dev-subnet-app.
      name: app

      # CIDR-блок, зарезервированный в Netbox (адрес/маска, маска не меньше 24).
      # Обязательно.
      cidrBlock: ""

      # Зарезервированные адреса, которые не выдаются подам.
      # Адрес шлюза добавляется в исключения сам.
      excludeIps: []

      # Подсети, с которыми разрешена связность.
      # ovn-default и Service-Subnet (172.30.0.0/15) шаблон добавляет сам.
      allowSubnets: []

# global - глобальные значения Helm. Инжектятся автоматически, когда чарт
# подключён сабчартом. Шаблоны чарта их не используют.
global: {}
