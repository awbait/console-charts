# ============================================================================
#  Helm-чарт namespace - полный справочник значений
#  Создаёт Namespace (cpaas/Alauda), ResourceQuota и подсеть kube-ovn.
#  Ресурсы создаются только при enabled=true.
# ============================================================================

# Выключатель ресурсов namespace. При false также выключите зависимости:
# subnet.enabled и serviceMesh.waypoint.
# Служебное поле, в форме портала скрыто. По умолчанию true, поэтому заказ из
# портала и обычный helm install создают ресурсы сразу. Ставь false, только
# если чарт подключён сабчартом и должен молчать.
enabled: true

# ----------------------------------------------------------------------------
# identity - теги окружения и проекта
# ----------------------------------------------------------------------------
# Проставляются на каждый ресурс чарта как labels:
#   ecpk/instance: <instance>
#   ecpk/cluster:  <cluster>
#   ecpk/project:  <project>
# Кроме того, project и cluster дают первые две части имени каждого ресурса:
# {project}-{cluster}-ns-{назначение}. В форме заказа секция скрыта: значения
# подставляет портал по окружению, в которое ставится заказ.
# Когда чарт подключён сабчартом, родитель может передать теги один раз через
# global.identity: тогда они сильнее этого блока (и уходят дальше, в сабчарт
# waypoint), дублировать их под ключом сабчарта не нужно.
identity:
  # Тег инстанса окружения. Обязателен. Допустимые значения - в README.md.
  instance: ed

  # Тег кластера окружения. Обязателен. Допустимые значения - в README.md.
  cluster: dev

  # Тег проекта. Обязателен. До 9 символов: строчные латинские буквы, цифры
  # и дефис (дефис не может быть первым или последним символом).
  project: nbox

# ----------------------------------------------------------------------------
# generic - общие labels/annotations на ресурсы самого чарта
# (Namespace, ResourceQuota). Метки Subnet задаются в subnet.generic;
# в форме портала секция скрыта (ui:widget: hidden).
# ----------------------------------------------------------------------------
generic:
  # Общие labels для Namespace и ResourceQuota. Результат: metadata.labels.
  labels:
    environment: production
    team: platform

  # Общие annotations для Namespace и ResourceQuota. Результат: metadata.annotations.
  annotations:
    owner: platform-team
    monitoring: "true"

# ----------------------------------------------------------------------------
# namespace - параметры создаваемого Namespace
# ----------------------------------------------------------------------------
namespace:
  # Назначение namespace задаётся в global.namespacePurpose (см. ниже). Здесь
  # его можно переопределить, но только для самого namespace: сабчарты этого
  # поля не видят, поэтому вместе с waypoint такое переопределение запрещено.
  # name: app

  # Имя namespace целиком, например team-app: тогда оно не собирается из
  # identity и назначения. DNS-метка до 63 символов. Подсеть по-прежнему
  # называется по назначению ({project}-{cluster}-subnet-<назначение>).
  # Сабчарт waypoint этого поля не видит: с waypoint задавайте имя в
  # global.namespaceOverride. Смена имени у существующего релиза создаёт
  # новый namespace, а старый Argo CD удалит вместе с содержимым.
  # namespaceOverride: team-app

  # Отображаемое имя (annotation cpaas.io/display-name).
  displayName: "Managed namespace"

  # Создатель namespace (annotation cpaas.io/creator). По умолчанию "lk".
  # Скрыто в форме портала; при заказе из консоли подставляется "console".
  creator: lk

  # Имена кластера и проекта так, как их знает консоль платформы (Alauda):
  # label cpaas.io/cluster, label cpaas.io/project и annotation
  # cpaas.io/project-inner-namespace. Пустые значения - в метки уходят теги
  # identity.cluster и identity.project. Нужны, когда в Alauda кластер или
  # проект называются иначе, чем теги окружения.
  cpaas:
    cluster: ""        # например ecpk-dev
    project: ""        # например ecpk-datamart

  # Роль namespace -> label namespace-role. Допустимо: ingress | egress | other.
  # По умолчанию other; в форме заказа поле скрыто.
  role: other

  # Уровень Pod Security Standards: restricted | baseline | privileged.
  # Непустое значение ставит на namespace три label
  # pod-security.kubernetes.io/{enforce,audit,warn} с этим уровнем. Пусто -
  # чарт метки не трогает, уровень определяет платформа.
  podSecurity: ""

# ----------------------------------------------------------------------------
# serviceMesh - подключение Istio (ambient) и сетевых политик
# ----------------------------------------------------------------------------
# Флаг enabled читается только в кластере dev. В остальных кластерах сетка
# включена всегда, и значение флага там ни на что не влияет. Когда сетка
# включена, namespace получает:
#   labels:     istio-discovery=enabled, istio.io/dataplane-mode=ambient
#   annotation: networking.k8s.io/enable-netpol="true"
serviceMesh:
  enabled: true

  # true - сетка только видит namespace: ставится одна метка
  # istio-discovery=enabled, без istio.io/dataplane-mode=ambient. Сервисы
  # namespace доступны из сетки, а его поды остаются вне ambient, и их трафик
  # никто не перехватывает. Действует в любом кластере, и там, где сетка
  # включена платформой. never сильнее. Вместе с waypoint не сочетается:
  # рендер останавливается.
  discovery: false

  # true - namespace никогда не попадает в сетку, в любом кластере: enabled и
  # правило платформы не учитываются, на namespace ставится
  # istio.io/dataplane-mode=none. Нужно неймспейсу транзитного шлюза
  # (VpcEgressGateway), который ломается от перехвата ambient. Вместе с
  # waypoint не сочетается: рендер останавливается.
  never: false

  # Подключает сабчарт waypoint: прокси, через который идёт обмен внутри
  # namespace. Требует включённой сетки, иначе рендер останавливается.
  waypoint: true

# ----------------------------------------------------------------------------
# waypoint - значения сабчарта (рендерится при serviceMesh.waypoint=true)
# ----------------------------------------------------------------------------
# Namespace сабчарт берёт из global.namespacePurpose и собирает то же имя, что и
# этот чарт: указывать его здесь не нужно. Если назначение задано в
# namespace.name, а не в global, повторите его в waypoint.namespacePurpose:
# чарт сверяет, куда придёт сабчарт, с тем namespace, который создаёт сам, и
# останавливает рендер при расхождении.
# Остальные параметры - в values.full.yaml чарта waypoint.
waypoint:
  waypoints:
    - name: mesh
      enabled: true
      for: service

# ----------------------------------------------------------------------------
# resourceQuotas - квоты ресурсов namespace
# ----------------------------------------------------------------------------
resourceQuotas:
  # Имя ресурса ResourceQuota. Пусто - "default".
  # Служебное поле, в форме портала скрыто.
  name: default

  # Жёсткие лимиты namespace.
  limits:
    cpu: "4"
    memory: "8Gi"

  # Запросы ресурсов. Не заданы - берутся из лимитов.
  requests:
    cpu: "2"
    memory: "4Gi"

  # Максимальное число подов (на практике ограничено маской подсети).
  # Служебное поле, в форме портала скрыто.
  podsAmount: 1000

  # Квоты на хранилища: класс -> объём на весь namespace.
  # Классы фиксированы платформой, пустое значение - такой диск не выдаётся.
  #   topolvm-mu - быстрый диск для частой записи: очереди, журналы, базы,
  #   topolvm-ri - экономичный диск для частого чтения: кеши, индексы.
  # Оба держат данные на диске своего сервера и копий на других не делают.
  #   ceph-rbd   - блочный том в кластере Ceph,
  #   ceph-rgw   - класс объектного хранилища Ceph (RGW),
  #   cephfs-hot - общая файловая система CephFS на быстром пуле.
  # Квота считает объём, запрошенный PVC этого класса.
  storage:
    topolvm-mu: "100Gi"
    topolvm-ri: "200Gi"
    ceph-rbd: "50Gi"
    ceph-rgw: ""
    cephfs-hot: "20Gi"

# ----------------------------------------------------------------------------
# subnet - значения сабчарта Subnet (одна подсеть на релиз namespace)
# ----------------------------------------------------------------------------
# Namespace и подсеть используют общие теги из global.identity ниже.
# Манифест Subnet рендерится только сабчартом; копии шаблона здесь нет.
subnet:
  # Включайте после резервирования CIDR. При enabled=false у родителя
  # также выключите subnet.enabled, иначе рендер остановится.
  enabled: true

  # Автоматическая привязка к создаваемому namespace. Не выключайте.
  namespaceBinding:
    enabled: true
    # Пусто - global.namespacePurpose. Повторите namespace.name, если оно задано.
    purpose: ""
    # Пусто - global.namespaceOverride. Повторите namespace.namespaceOverride,
    # если полное имя задано только в секции namespace.
    namespaceOverride: ""

  # Метки родителя generic не наследуются сабчартом автоматически.
  generic:
    labels:
      environment: production
      team: platform
    annotations:
      owner: platform-team
      monitoring: "true"

  # Сетевые параметры сабчарта. Полный справочник - subnet/values.full.yaml.
  subnet:
    name: ""                     # пусто - назначение namespace
    mask: 24                      # размер подсети, выбирает заказчик (/24 - 253 пода)
    reservedIps: 0                # сколько адресов не выдавать подам, кроме шлюза
    cidrBlock: "10.24.8.0/24"     # заполняет платформа: диапазон с маской mask
    natOutgoing: false            # NAT средствами kube-ovn
    excludeIPs: []                # дополнительные IP или диапазоны start..end
    gatewayType: distributed      # distributed или centralized
    gatewayNodes: ""              # узлы centralized через запятую
    private: true                 # изоляция подсети
    allowSubnets: []              # 172.30.0.0/15 шаблон добавляет всегда
    namespaces: []                # оставьте пустым: привязка вычисляется автоматически
    default: false                # зафиксировано схемой
    protocol: IPv4                # зафиксировано схемой
    enableEcmp: false              # зафиксировано схемой

# ----------------------------------------------------------------------------
# global - значения, которые видит и сам чарт, и его сабчарты
# ----------------------------------------------------------------------------
# Helm раздаёт global всем сабчартам, поэтому назначение namespace живёт здесь:
# из него и чарт, и waypoint собирают одно и то же имя, и синхронизировать
# руками нечего.
global:
  # Общие теги namespace, subnet и waypoint. Сильнее локальных identity.
  identity:
    instance: ed
    cluster: dev
    project: nbox

  # Назначение namespace: последняя часть имени, 2..12 символов. Обязательно.
  # Полное имя собирается как {identity.project}-{identity.cluster}-ns-<значение>,
  # для примера ниже получится nbox-dev-ns-app.
  namespacePurpose: app

  # Имя namespace целиком для этого чарта и сабчарта waypoint, например
  # team-app. Пустое - имя собирается из identity и назначения. Поле
  # namespace.namespaceOverride, если задано, главнее.
  # namespaceOverride: team-app
