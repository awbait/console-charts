# namespace - минимальный рабочий пример.
# Создаёт Namespace и ResourceQuota, без выделенной подсети.

enabled: true

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: demo        # тег проекта, до 9 символов

global:
  namespacePurpose: app  # получится demo-dev-ns-app

resourceQuotas:
  unlimited:
    limits:
      cpu: false
      memory: false
    requests:
      cpu: false
      memory: false
    pods: false
    storage:
      topolvm-mu: false
      topolvm-ri: false
      ceph-rbd: false
      ceph-rgw: false
      cephfs-hot: false
  limits:
    cpu: "2"
    memory: "4Gi"
  requests:
    cpu: "1"
    memory: "2Gi"

subnet:
  enabled: false
