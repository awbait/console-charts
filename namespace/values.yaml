# namespace - значения по умолчанию (минимум, при котором проходит рендер).
# При enabled=false также выключите subnet.enabled и serviceMesh.waypoint.
# Полный справочник параметров - values.full.yaml, рабочий пример - values.minimal.yaml.

enabled: true

# Теги окружения и проекта: попадают в labels ecpk/instance, ecpk/cluster,
# ecpk/project на всех ресурсах, а project и cluster - ещё и в имена ресурсов.
# Допустимые значения - в README.md. Когда чарт подключён сабчартом и родитель
# задал global.identity, читается global.identity, а этот блок не учитывается.
identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}           # общие labels на Namespace и ResourceQuota
  annotations: {}      # общие annotations на Namespace и ResourceQuota

# Назначение неймспейса: одно слово, из которого собираются имена. Лежит в
# global, потому что его же читает сабчарт waypoint - Helm раздаёт global всем
# сабчартам, и вводить назначение дважды не нужно.
global:
  namespacePurpose: app

namespace:
  # name переопределяет global.namespacePurpose только для самого неймспейса.
  # namespaceOverride задаёт имя неймспейса целиком, например team-app: имя
  # больше не собирается из identity и назначения. Это же поле есть в global,
  # его читает и сабчарт waypoint.
  namespaceOverride: ""
  displayName: "Managed namespace"
  role: other
  creator: lk
  podSecurity: ""      # "" | restricted | baseline | privileged
  # Имена кластера и проекта в консоли платформы (Alauda): метки cpaas.io/cluster
  # и cpaas.io/project, annotation cpaas.io/project-inner-namespace. Пустые -
  # берутся теги identity.cluster и identity.project.
  cpaas:
    cluster: ""
    project: ""

serviceMesh:
  enabled: false       # учитывается только в кластере dev, в остальных сетка включена всегда
  discovery: false     # true - только метка istio-discovery=enabled, без ambient, в любом кластере
  never: false         # true - неймспейс никогда не в сетке, в любом кластере
  waypoint: false      # подключает сабчарт waypoint, требует включённой сетки

# Значения сабчарта waypoint. Неймспейс он берёт из global.namespacePurpose,
# отдельно указывать не нужно.
waypoint:
  waypoints:
    - name: mesh
      enabled: true
      for: service

# Лимиты обязательны: без них рендер останавливается.
resourceQuotas:
  # Снятие квоты с отдельного ресурса: при true ключ не попадает в квоту, а
  # заданное для него значение игнорируется. Лимиты при этом всё равно
  # обязательны, из них берутся незаданные requests. Если сняты все квоты,
  # ResourceQuota не создаётся. Служебные флаги, в форме портала скрыты.
  unlimited:
    limits:
      cpu: false
      memory: false
    requests:
      cpu: false
      memory: false
    pods: false
    storage:
      topolvm-mu: false
      topolvm-ri: false
      ceph-rbd: false
      ceph-rgw: false
      cephfs-hot: false
  limits:
    cpu: "4"
    memory: "8Gi"
  requests:
    cpu: ""
    memory: ""
  podsAmount: 1000
  # Квоты на хранилища: класс -> объём. Пустое значение - диск не выдаётся.
  storage:
    topolvm-mu: ""
    topolvm-ri: ""
    ceph-rbd: ""
    ceph-rgw: ""
    cephfs-hot: ""

# Сабчарт Subnet. Включайте только после резервирования диапазона.
# Общие identity передавайте через global.identity, чтобы теги совпадали.
subnet:
  enabled: false
  namespaceBinding:
    enabled: true
  subnet:
    name: ""            # наследует global.namespacePurpose
    # mask: 26          # размер подсети для брони в Netbox; если задан, должен совпасть с маской cidrBlock
    reservedIps: 0      # сколько адресов не выдавать подам, кроме адреса шлюза
    cidrBlock: ""       # зарезервированный диапазон с маской, например 10.24.8.0/26
