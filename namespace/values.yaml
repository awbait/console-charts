# namespace - значения по умолчанию (минимум, при котором проходит рендер).
# При enabled=false чарт не создаёт ни одного ресурса.
# Полный справочник параметров - values.full.yaml, рабочий пример - values.minimal.yaml.

enabled: true

# Теги окружения и проекта: попадают в labels ecpk/instance, ecpk/cluster,
# ecpk/project на всех ресурсах, а project и cluster - ещё и в имена ресурсов.
# Допустимые значения - в README.md.
identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}           # общие labels на ВСЕ ресурсы чарта (Namespace/ResourceQuota/Subnet)
  annotations: {}      # общие annotations на ВСЕ ресурсы чарта

namespace:
  name: app            # назначение неймспейса; полное имя - {project}-{cluster}-ns-{name}
  displayName: "Managed namespace"
  role: other
  creator: lk
  annotations: {}
  labels: {}

serviceMesh:
  enabled: false

resourceQuotas:
  limits:
    cpu: ""
    memory: ""
  requests:
    cpu: ""
    memory: ""
  podsAmount: 1000
  # Квоты на хранилища: класс -> объём. Пустое значение - класс не выдаётся.
  storage:
    topolvm-mu: ""
    topolvm-ri: ""

subnet:
  enable: false
  subnets:
    - name: app        # назначение подсети; полное имя - {project}-{cluster}-subnet-{name}
      cidrBlock: ""
      excludeIps: []
      allowSubnets: []
