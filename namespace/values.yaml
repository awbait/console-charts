# managed-namespace - значения по умолчанию (минимум, при котором проходит рендер).
# При global.enable=false чарт не создаёт ни одного ресурса.
# Полный справочник параметров - values.full.yaml, рабочий пример - values.minimal.yaml.

global:
  enable: false

# Теги окружения и проекта: попадают в labels ecpk/instance, ecpk/cluster,
# ecpk/project на всех ресурсах. Допустимые значения - в README.md.
identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}           # общие labels на ВСЕ ресурсы чарта (Namespace/ResourceQuota/Subnet)
  annotations: {}      # общие annotations на ВСЕ ресурсы чарта

namespace:
  namespaceName: "project-dev-ns-default"
  projectName: project
  clusterName: common
  displayName: "Managed namespace"
  creator: lk
  annotations: {}
  labels: {}

serviceMesh:
  enabled: false

resourceQuotas:
  limits:
    cpu: ""
    memory: ""
  requests:
    cpu: ""
    memory: ""
  podsAmount: 1000
  storage:
    storages: {}

subnet:
  enable: false
  subnets:
    - name: "project-dev-subnet-default"
      cidrBlock: ""
      excludeIps: []
      allowSubnets: []
