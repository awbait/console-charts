{{/*
Service of a server: one per element of the servers list, ClusterIP on
servers[].port (80 by default) to the http port of the pods. This is the name
a route of the ingress-gateway chart points at. The element is skipped when
enabled: false.
*/}}
{{- if eq (include "openresty.helpers.chartEnabled" .) "true" }}
{{- $root := . -}}
{{- range $index, $server := $root.Values.servers }}
{{- if eq (include "openresty.helpers.app.enabled" $server) "true" }}
{{- $name := required (printf "servers[%d].name is required" $index) $server.name }}
{{- $port := $server.port | default 80 -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $port))) (lt (int $port) 1) (gt (int $port) 65535) -}}
{{- fail (printf "servers[%d].port must be a port number from 1 to 65535, got %q" $index (toString $port)) -}}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openresty.helpers.app.resourceName" (dict "kindShort" "svc" "name" $name "context" $root) }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "openresty.helpers.app.metadata" (dict "context" $root "labels" (dict "app.kubernetes.io/component" $name)) | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openresty.helpers.app.serverSelectorLabels" (dict "context" $root "name" $name) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
