# policies - значения по умолчанию (минимум, при котором проходит рендер).
# По умолчанию политики не создаются: все три списка пустые.
# Полный справочник параметров - values.full.yaml, рабочий пример - values.minimal.yaml.

# Теги окружения и проекта: попадают в имя каждого ресурса и в labels
# ecpk/instance, ecpk/cluster, ecpk/project. Допустимые значения - в README.md.
identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}           # общие labels на ВСЕ ресурсы чарта
  annotations: {}      # общие annotations на ВСЕ ресурсы чарта

defaults:
  trustDomain: cluster.local
  namespaceLabelKey: kubernetes.io/metadata.name
  protocol: TCP

policies: []
netpol: []
authzpol: []
