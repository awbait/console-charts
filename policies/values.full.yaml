# ============================================================================
#  Helm-чарт policies - полный справочник значений
#  Здесь перечислены все параметры с описанием. Секции независимы, можно
#  использовать любое их сочетание:
#
#    policies[]  - универсальные политики. Один блок описывает связь
#                  источник <-> получатель: создаются NetworkPolicy и
#                  AuthorizationPolicy, а правила зеркалятся в namespace
#                  второй стороны.
#
#    netpol[]    - только NetworkPolicy, без зеркал. Для тонкого контроля
#                  L3/L4 или правил по ipBlock без Istio.
#
#    authzpol[]  - только AuthorizationPolicy. Для L7-сценариев Istio или
#                  когда NetworkPolicy описаны иначе.
#
#  Имя каждого ресурса:
#    {instance}-{cluster}-{kindShort}-{project}-{name}
#  kindShort: np (NetworkPolicy) | ap (AuthorizationPolicy).
#  Имя должно быть уникально в пределах пары (namespace, тип ресурса).
# ============================================================================


# ----------------------------------------------------------------------------
# identity - теги окружения и проекта (см. схему имени выше)
# ----------------------------------------------------------------------------
# instance / cluster / project задаются один раз на релиз.
# kindShort подставляется автоматически по типу ресурса (np | ap).
# name - это имя элемента секции (policy.name) ниже.
#
# Эти же теги проставляются на каждый ресурс чарта как labels:
#   ecpk/instance: <instance>
#   ecpk/cluster:  <cluster>
#   ecpk/project:  <project>
identity:
  # Тег инстанса окружения. Обязателен. Допустимые значения - в README.md.
  instance: ed

  # Тег кластера окружения. Обязателен. Допустимые значения - в README.md.
  cluster: dev

  # Тег проекта. Обязателен. До 9 символов: строчные латинские буквы, цифры
  # и дефис (дефис не может быть первым или последним символом).
  project: nbox


# ----------------------------------------------------------------------------
# generic - общие labels/annotations на ВСЕ ресурсы чарта (NP + AP)
# ----------------------------------------------------------------------------
# Задаются только глобально; в форме портала секция скрыта.
generic:
  # Общие labels для всех ресурсов чарта. Результат: metadata.labels.
  labels:
    environment: production
    team: platform

  # Общие annotations для всех ресурсов чарта. Результат: metadata.annotations.
  annotations:
    owner: platform-team
    monitoring: "true"


# ----------------------------------------------------------------------------
# defaults - значения по умолчанию для всех секций
# ----------------------------------------------------------------------------
defaults:
  # Istio trust domain, из которого собирается principal:
  #   {trustDomain}/ns/{namespace}/sa/{serviceAccount}
  trustDomain: cluster.local

  # Ключ label namespace для namespaceSelector в NetworkPolicy.
  # Стандарт Kubernetes - kubernetes.io/metadata.name (проставляется сам).
  namespaceLabelKey: kubernetes.io/metadata.name

  # Протокол по умолчанию для портов в NetworkPolicy.
  # Переопределяется у конкретного порта: ports: [{ port: 1053, protocol: UDP }]
  protocol: TCP


# ============================================================================
# policies - универсальные политики (NetworkPolicy + AuthorizationPolicy)
# ============================================================================
# Одна запись -> следующие манифесты:
#   - в namespace релиза:            np (ingress+egress) и ap владельца
#   - в каждом namespace получателя: np (ingress) и ap (зеркало egress-правила)
#   - в каждом namespace отправителя: np (egress, зеркало ingress-правила)
#
# Несколько правил с одним и тем же namespace второй стороны собираются в один
# зеркальный манифест (порты объединяются).
policies:
  - # Имя политики: 2..6 символов, строчные латинские буквы, цифры и дефис.
    # Подставляется в {name} имени ресурсов.
    name: core1

    # Необязательно, по умолчанию true. При false политика пропускается целиком.
    enabled: true

    # ServiceAccount workload-владельца. Идёт в principal зеркальной AP на
    # стороне получателя. Обязателен, если есть egress-правила.
    serviceAccount: netbox

    # Pod selector workload-владельца. Используется как:
    #   - podSelector в NetworkPolicy владельца
    #   - selector   в AuthorizationPolicy владельца
    selector:
      app.kubernetes.io/name: netbox

    # Ingress-правила: кому разрешено ходить в owner.
    # Каждое правило -> spec.ingress (NP) и запись в spec.rules (AP), плюс
    # зеркальная egress NetworkPolicy в namespace отправителя (только для
    # peers формы namespace + selector). Отдельный релиз чарта у отправителя
    # для этого не нужен.
    ingress:
      - # Источники трафика. Поддерживаются формы:
        #   namespace + selector (+ необязательный serviceAccount для principal AP)
        #   ipBlock
        #   namespaceSelector / podSelector (сырой формат Kubernetes, для сложных случаев)
        from:
          - namespace: netbox-ingress
            selector:
              app.kubernetes.io/name: ingress-istio
            # Необязательно: SA отправителя для principal в AP.
            #   задан    -> principals: cluster.local/ns/.../sa/<SA>
            #   не задан -> namespaces: [<namespace>]
            serviceAccount: netbox-ingress-gateway-istio

        # Порты. Каждая запись - объект { port, protocol }:
        #   - { port: 8080 }                (протокол из defaults.protocol)
        #   - { port: 8080, protocol: TCP } (протокол задан явно)
        ports:
          - port: 8080

    # Egress-правила: куда owner может ходить.
    # Каждое правило -> spec.egress в NP владельца и зеркала NP+AP в namespace
    # получателя.
    egress:
      - to:
          - namespace: netbox-postgresql
            selector:
              app.kubernetes.io/name: postgresql
            # Внимание: peer.serviceAccount в egress запрещён - рендер упадёт.
            # SA владельца берётся из policy.serviceAccount.
        ports:
          - port: 5432

      - to:
          - namespace: netbox-valkey
            selector:
              app.kubernetes.io/name: valkey
        ports:
          - port: 6379
            protocol: TCP


# ============================================================================
# netpol - только NetworkPolicy (без AuthorizationPolicy и без зеркал)
# ============================================================================
# Для сценариев уровня L3/L4 и правил по ipBlock.
netpol:
  - # Имя ресурса: {instance}-{cluster}-np-{project}-{name}.
    name: ing

    enabled: true

    # podSelector. Не задан -> политика применяется ко всем подам namespace.
    selector:
      app.kubernetes.io/name: ingress-istio

    # Ingress-правила: список {from: [...], ports: [...]}.
    ingress:
      - from:
          - ipBlock:
              cidr: 0.0.0.0/0
              # except: [10.0.0.0/8]
        ports:
          - port: 443
          - port: 15020
          - port: 15021
          - port: 15090

    # Egress-правила: список {to: [...], ports: [...]}.
    egress:
      - to:
          - namespace: netbox-core
            selector:
              app.kubernetes.io/name: netbox
        ports:
          - port: 8080


# ============================================================================
# authzpol - только AuthorizationPolicy (без NetworkPolicy)
# ============================================================================
# Для L7-правил Istio или когда NetworkPolicy описаны другим инструментом.
authzpol:
  - # Имя ресурса: {instance}-{cluster}-ap-{project}-{name}.
    name: gate

    enabled: true

    # action: ALLOW (по умолчанию) | DENY | AUDIT | CUSTOM
    action: ALLOW

    # selector - к кому применяется политика. Не задан -> ко всем workload
    # в namespace.
    selector:
      app.kubernetes.io/name: ingress-istio

    # rules - список правил. В правиле могут быть from / ports / when.
    rules:
      - # Источник. Поддерживаются формы:
        #   serviceAccounts - разворачиваются в principals
        #   principals      - готовые строки principal
        #   ipBlocks
        #   namespaces
        from:
          ipBlocks:
            - 0.0.0.0/0
        ports:
          - port: 443

  - name: vkpr

    selector:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/component: primary

    rules:
      - from:
          serviceAccounts:
            - namespace: netbox-core
              name: netbox
            - namespace: netbox-valkey
              name: netbox-valkey-primary
            - namespace: netbox-valkey
              name: netbox-valkey-replica
        ports:
          - port: 6379

        # Условия when. Сейчас поддерживается sourceNamespaces.
        when:
          sourceNamespaces:
            - netbox-core
            - netbox-valkey
