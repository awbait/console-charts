# Минимальный пример: одна универсальная политика.
# Описывает netbox в namespace релиза: один вход (от ingress-шлюза) и один
# выход (в postgresql).
#
# Что получится:
# - в namespace релиза: NetworkPolicy (ingress+egress) + AuthorizationPolicy
# - в netbox-postgresql: NetworkPolicy (ingress) + AuthorizationPolicy (зеркало egress)
# - в netbox-ingress:    NetworkPolicy (egress, зеркало ingress-правила)
#
# Пустые netpol/authzpol гасят примеры из values.yaml, когда файл передаётся
# через -f при установке.

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

netpol: []
authzpol: []

policies:
  - name: core
    serviceAccount: netbox             # обязателен, если есть egress-правила
    selector:
      app.kubernetes.io/name: netbox

    ingress:
      - from:
          - namespace: netbox-ingress
            selector:
              app.kubernetes.io/name: ingress-istio
            serviceAccount: netbox-ingress-gateway-istio
        ports:
          - port: 8080

    egress:
      - to:
          - namespace: netbox-postgresql
            selector:
              app.kubernetes.io/name: postgresql
        ports:
          - port: 5432
