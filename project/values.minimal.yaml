# project - минимальный рабочий пример.
# Создаёт один Project с квотой ресурсов на одном кластере.

enabled: true

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: demo        # тег проекта, до 9 символов

project:
  name: demo-project
  displayName: "Demo project"
  description: "Demo project for team X"

clusters:
  - name: global
    quota:
      limits.cpu: "4"
      limits.memory: 8Gi
      requests.storage: 10Gi
