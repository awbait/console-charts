# waypoint - значения по умолчанию (минимум, при котором проходит рендер).
# По умолчанию waypoint'ы не создаются: список пустой.
# Полный справочник параметров - values.full.yaml, рабочий пример - values.minimal.yaml.

# Теги окружения и проекта: попадают в имя каждого ресурса и в labels
# ecpk/instance, ecpk/cluster, ecpk/project. Допустимые значения - в README.md.
identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}
  annotations: {}

waypoints: []
