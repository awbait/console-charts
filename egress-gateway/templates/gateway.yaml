{{/*
Egress Gateway (Gateway API, class istio) - a SINGLE gateway built from
.Values.egressGateway. The user names it; the listeners come from the external
services of the release, one per hostname:
  - name     the deepest level of the domain (kc.idp.ecpk.test -> kc);
  - port     443, protocol TLS, mode Passthrough - fixed;
  - allowedRoutes stay on Same: the outbound routes are created next to the
    gateway, and a route from a sender namespace reaches the gateway through a
    backendRef and a ReferenceGrant, not through this listener.
infrastructure.parametersRef references the ConfigMap (see configmap.yaml), which
shares the same name as the Gateway (kindShort egw).
The Service of the gateway stays internal (annotation networking.istio.io/service-type).
The whole gateway is skipped when enabled: false.
*/}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- /* Always rendered, so this is where the whole release is checked for names that would collide in the cluster. */ -}}
{{- include "egress-gateway.helpers.app.uniqueNames" . -}}
{{- $gw := .Values.egressGateway | default dict }}
{{- if and $gw (eq (include "egress-gateway.helpers.app.enabled" $gw) "true") }}
{{- $gwName := required "egressGateway.name is required" $gw.name }}
{{- $gwFullname := include "egress-gateway.helpers.app.fullname" (dict "kindShort" "egw" "name" $gwName "context" $) }}
{{- $entries := .Values.serviceEntries | default list }}
{{- if not $entries }}
{{- fail "serviceEntries must contain at least one external service: the gateway takes its listeners from their hostnames" }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwFullname }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $ "annotations" (dict "networking.istio.io/service-type" "ClusterIP")) | nindent 2 }}
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $gwFullname }}
  listeners:
    {{- range $index, $entry := $entries }}
    {{- if eq (include "egress-gateway.helpers.app.enabled" $entry) "true" }}
    {{- $hostname := required (printf "serviceEntries[%d].hostname is required" $index) $entry.hostname }}
    - name: {{ include "egress-gateway.helpers.app.listenerName" (dict "label" (printf "serviceEntries[%d].hostname" $index) "value" $hostname) }}
      hostname: {{ $hostname | quote }}
      port: 443
      protocol: TLS
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
