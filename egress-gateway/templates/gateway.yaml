{{/* A fixed service waypoint and its infrastructure in every sender namespace. */}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- include "egress-gateway.helpers.validate" . -}}
{{- if eq (include "egress-gateway.helpers.mode" .) "mesh" }}
{{- $root := . }}
{{- $fullname := include "egress-gateway.helpers.gatewayFullname" $root }}
{{- range $namespace := (include "egress-gateway.helpers.sendersNamespaces" $root | fromJsonArray) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root "labels" (dict "istio.io/waypoint-for" "service") "annotations" (dict "networking.istio.io/service-type" "ClusterIP")) | nindent 2 }}
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $fullname }}
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
data:
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 2
      maxReplicas: 5
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 80
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: istio-proxy
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 2000m
                  memory: 1024Mi
{{- end }}
{{- end }}
{{- end }}
