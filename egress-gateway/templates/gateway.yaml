{{/*
Egress waypoint (Gateway API, class istio-waypoint) - a SINGLE gateway built
from .Values.egressGateway. The user names it; everything else is the standard
waypoint shape from the Istio ambient egress pattern:
  - label istio.io/waypoint-for: service - the waypoint serves ServiceEntries;
  - one listener: mesh, port 15008, protocol HBONE. ztunnel tunnels the traffic
    of every ServiceEntry labelled istio.io/use-waypoint into it, and the
    waypoint lets it out to the external host itself - no routes, no Service
    backendRefs.
  - allowedRoutes stay on Same while every sender sits in the release
    namespace; a sender namespace of its own gets into a Selector, because a
    cross-namespace waypoint binding is only honoured when the listener admits
    that namespace.
infrastructure.parametersRef references the ConfigMap (see configmap.yaml), which
shares the same name as the Gateway (kindShort egw).
The Service of the gateway stays internal (annotation networking.istio.io/service-type).
The whole gateway is skipped when enabled: false.
*/}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- /* Always rendered, so this is where the whole release is checked for names that would collide in the cluster. */ -}}
{{- include "egress-gateway.helpers.app.uniqueNames" . -}}
{{- $gw := .Values.egressGateway | default dict }}
{{- if and $gw (eq (include "egress-gateway.helpers.app.enabled" $gw) "true") }}
{{- $gwName := required "egressGateway.name is required" $gw.name }}
{{- $gwFullname := include "egress-gateway.helpers.app.fullname" (dict "kindShort" "egw" "name" $gwName "context" $) }}
{{- $entries := .Values.serviceEntries | default list }}
{{- if not $entries }}
{{- fail "serviceEntries must contain at least one external service: the waypoint carries no traffic until a ServiceEntry is bound to it" }}
{{- end }}
{{- $namespaces := include "egress-gateway.helpers.app.backendNamespaces" . | fromJsonArray }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwFullname }}
  namespace: {{ $.Release.Namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $ "labels" (dict "istio.io/waypoint-for" "service") "annotations" (dict "networking.istio.io/service-type" "ClusterIP")) | nindent 2 }}
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $gwFullname }}
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      {{- if gt (len $namespaces) 1 }}
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- range $namespace := $namespaces }}
                  - {{ $namespace | quote }}
                  {{- end }}
      {{- end }}
{{- end }}
{{- end }}
