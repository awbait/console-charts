{{/* A service waypoint with shared infrastructure settings in every sender namespace. */}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- include "egress-gateway.helpers.validate" . -}}
{{- if eq (include "egress-gateway.helpers.mode" .) "mesh" }}
{{- $root := . }}
{{- $fullname := include "egress-gateway.helpers.gatewayFullname" $root }}
{{- $waypoint := .Values.waypoint | default dict }}
{{- $hpa := $waypoint.hpa | default dict }}
{{- range $namespace := (include "egress-gateway.helpers.sendersNamespaces" $root | fromJsonArray) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root "labels" (dict "istio.io/waypoint-for" "service") "annotations" (dict "networking.istio.io/service-type" "ClusterIP")) | nindent 2 }}
spec:
  gatewayClassName: istio-waypoint
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $fullname }}
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
data:
  {{- if eq (include "egress-gateway.helpers.app.enabled" $hpa) "true" }}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: {{ $hpa.minReplicas | default 2 }}
      maxReplicas: {{ $hpa.maxReplicas | default 5 }}
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: {{ $hpa.averageUtilization | default 80 }}
  {{- end }}
  deployment: |
    spec:
      template:
        spec:
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          {{- with $waypoint.resources }}
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml . | nindent 16 }}
          {{- end }}
{{- end }}
{{- end }}
{{- end }}
