{{/*
ServiceEntry - one per entry of .Values.serviceEntries, each describing a single
external service the senders reach through the gateway. Mode mesh only: in
mode direct there is no waypoint to bind an entry to.

Every entry lands in the namespace of the senders (senders.namespace) and
carries both binding labels: istio.io/use-waypoint with the name of the egress
Gateway and istio.io/use-waypoint-namespace with the waypoint namespace, because
the gateway always stands in a namespace of its own. ztunnel picks the traffic
of the entry up in the senders namespace and tunnels it into the waypoint over
HBONE; the listener of the waypoint admits the senders namespace through
allowedNamespaces (checked in validate).
exportTo keeps the entry visible in its own namespace and in the namespace of
the gateway, so the waypoint resolves the same host.
Everything else is fixed: MESH_EXTERNAL, DNS resolution, one TLS port 443.
*/}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- include "egress-gateway.helpers.validate" . -}}
{{- if eq (include "egress-gateway.helpers.mode" .) "mesh" }}
{{- $root := . }}
{{- $gwFullname := include "egress-gateway.helpers.gatewayFullname" $root }}
{{- $gwNamespace := include "egress-gateway.helpers.waypointNamespace" $root }}
{{- $senders := include "egress-gateway.helpers.sendersNamespace" $root }}
{{- range $index, $entry := .Values.serviceEntries }}
{{- if eq (include "egress-gateway.helpers.app.enabled" $entry) "true" }}
{{- $seName := required (printf "serviceEntries[%d].name is required" $index) $entry.name }}
{{- $hostname := required (printf "serviceEntries[%d].hostname is required" $index) $entry.hostname }}
---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: {{ include "egress-gateway.helpers.app.fullname" (dict "kindShort" "egw" "name" $seName "context" $root) }}
  namespace: {{ $senders | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root "labels" (dict "istio.io/use-waypoint" $gwFullname "istio.io/use-waypoint-namespace" $gwNamespace)) | nindent 2 }}
spec:
  hosts:
    - {{ $hostname | quote }}
  exportTo:
    - "."
    - {{ $gwNamespace | quote }}
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - name: tls
      number: 443
      protocol: TLS
{{- end }}
{{- end }}
{{- end }}
{{- end }}
