{{/*
NetworkPolicies of the egress gateway, created together when
networkPolicy.enabled. Mode mesh only: they guard the waypoint, which mode
direct does not have (a namespace outside the mesh gets no policies at all).

In the waypoint namespace, on the pods the Istio Gateway controller makes for
the Gateway (label gateway.networking.k8s.io/gateway-name):
  {name}-out - what the gateway may reach. istiod (istio-system:15012) and
               CoreDNS (kube-system:1053, TCP and UDP) are fixed; the external
               endpoints come from networkPolicy.endpoints, which is required
               when the section is on.
  {name}-in  - who may reach the gateway: the senders namespace, on the HBONE
               listener port 15008 (ztunnel tunnels the sender traffic into the
               waypoint on that port).

In the senders namespace, on every pod, when networkPolicy.senders (default
true):
  {name}-senders - egress to the waypoint namespace on 15008. A namespace in
               the mesh runs under the default policies of the platform
               (annotation networking.k8s.io/enable-netpol), and without this
               rule ztunnel cannot open the HBONE tunnel out of it. Switch it
               off only for a senders namespace that has no default policies:
               there it would isolate the pods instead.
*/}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- include "egress-gateway.helpers.validate" . -}}
{{- $root := . }}
{{- $networkPolicy := $root.Values.networkPolicy | default dict }}
{{- if and (eq (include "egress-gateway.helpers.mode" $root) "mesh") (eq (include "egress-gateway.helpers.app.enabled" $networkPolicy) "true") }}
{{- $gwFullname := include "egress-gateway.helpers.gatewayFullname" $root }}
{{- $gwNamespace := include "egress-gateway.helpers.waypointNamespace" $root }}
{{- $senders := include "egress-gateway.helpers.sendersNamespace" $root }}
{{- $waypoint := include "egress-gateway.helpers.waypoint" $root | fromJson }}
{{- $endpoints := $networkPolicy.endpoints | default list }}
{{- if not $endpoints }}
{{- fail "networkPolicy.endpoints is required when networkPolicy.enabled=true: name the address and the port of every external endpoint the gateway has to reach" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "egress-gateway.helpers.app.fullname" (dict "kindShort" "np" "parent" $waypoint.name "name" "out" "context" $root) }}
  namespace: {{ $gwNamespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "egress-gateway.helpers.gatewayWorkloadSelectorLabels" (dict "gatewayResourceName" $gwFullname) | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 1053
          protocol: TCP
        - port: 1053
          protocol: UDP
    {{- range $index, $endpoint := $endpoints }}
    - to:
        - ipBlock:
            cidr: {{ include "egress-gateway.helpers.app.endpointCidr" (dict "label" (printf "networkPolicy.endpoints[%d].address" $index) "value" $endpoint.address) | quote }}
      ports:
        - port: {{ required (printf "networkPolicy.endpoints[%d].port is required" $index) $endpoint.port }}
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "egress-gateway.helpers.app.fullname" (dict "kindShort" "np" "parent" $waypoint.name "name" "in" "context" $root) }}
  namespace: {{ $gwNamespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "egress-gateway.helpers.gatewayWorkloadSelectorLabels" (dict "gatewayResourceName" $gwFullname) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $senders | quote }}
      ports:
        - port: 15008
          protocol: TCP
{{- if or (not (hasKey $networkPolicy "senders")) (eq (toString $networkPolicy.senders | lower) "true") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "egress-gateway.helpers.app.fullname" (dict "kindShort" "np" "parent" $waypoint.name "name" "senders" "context" $root) }}
  namespace: {{ $senders | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $gwNamespace | quote }}
      ports:
        - port: 15008
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
