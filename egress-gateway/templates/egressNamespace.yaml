{{/*
Namespace and kube-ovn Subnet for the VpcEgressGateway, created only when
egressNamespace.enabled. Both carry the name the user gave, not the five-part
convention: a namespace and a subnet are referenced from outside the release.

The namespace is labelled role=egress. The subnet shares its name, holds a /29
and is bound to that one namespace, so the VpcEgressGateway pods take their
addresses from it and the outbound traffic is SNAT'ed from a known block.
allowSubnets keeps the subnet reachable from the service subnet of the cluster
(fixed) and from the subnets of the project (egressNamespace.allowSubnets).

The section exists to host the VpcEgressGateway, so it needs at least one.
Without it the release would leave an empty namespace and a reserved subnet
behind.
*/}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- $egressNamespace := .Values.egressNamespace | default dict }}
{{- if eq (include "egress-gateway.helpers.app.enabled" $egressNamespace) "true" }}
{{- if not .Values.vpcEgressGateway }}
{{- fail "egressNamespace.enabled=true without vpcEgressGateway: the namespace and its subnet exist to host the outbound addresses of this release" }}
{{- end }}
{{- $name := include "egress-gateway.helpers.app.egressNamespace" . }}
{{- $cidr := include "egress-gateway.helpers.app.egressSubnetCidr" . }}
{{- $gatewayIP := include "egress-gateway.helpers.app.subnetGatewayIP" $cidr }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $name }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $ "labels" (dict "role" "egress" "kubernetes.io/metadata.name" $name)) | nindent 2 }}
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: {{ $name }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $) | nindent 2 }}
spec:
  default: false
  protocol: IPv4
  cidrBlock: {{ $cidr }}
  natOutgoing: false
  excludeIps:
    - {{ $gatewayIP }}
  gateway: {{ $gatewayIP }}
  gatewayType: centralized
  private: true
  allowSubnets:
    - 172.30.0.0/15
    {{- range $subnet := ($egressNamespace.allowSubnets | default list) }}
    - {{ $subnet }}
    {{- end }}
  enableEcmp: false
  namespaces:
    - {{ $name }}
{{- end }}
{{- end }}
