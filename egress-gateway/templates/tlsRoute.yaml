{{/*
Two TLSRoutes per external service, the pair that carries the traffic out:

  {name}          sender -> gateway. Lives next to its ServiceEntry, takes that
                  ServiceEntry as its parent and sends the traffic to the Service
                  of the egress gateway on port 443. A route in a sender
                  namespace crosses a boundary here, which the ReferenceGrant
                  next to the gateway permits (see referenceGrant.yaml).

  {gateway}-{name} gateway -> external host. Lives next to the gateway, hangs on
                  the listener of that hostname through sectionName and sends the
                  traffic to the host itself (backendRef kind Hostname).

Both are skipped when the gateway is disabled.
*/}}
{{- if eq (include "egress-gateway.helpers.chartEnabled" .) "true" }}
{{- if .Values.serviceEntries }}
{{- $root := . }}
{{- $gwFullname := include "egress-gateway.helpers.app.gatewayFullname" $root }}
{{- $gwName := $root.Values.egressGateway.name }}
{{- range $index, $entry := .Values.serviceEntries }}
{{- if eq (include "egress-gateway.helpers.app.enabled" $entry) "true" }}
{{- $seName := required (printf "serviceEntries[%d].name is required" $index) $entry.name }}
{{- $hostname := required (printf "serviceEntries[%d].hostname is required" $index) $entry.hostname }}
{{- $namespace := include "egress-gateway.helpers.app.serviceEntryNamespace" (dict "entry" $entry "context" $root) }}
{{- $seFullname := include "egress-gateway.helpers.app.fullname" (dict "kindShort" "egw" "name" $seName "context" $root) }}
{{- $listener := include "egress-gateway.helpers.app.listenerName" (dict "label" (printf "serviceEntries[%d].hostname" $index) "value" $hostname) }}
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "egress-gateway.helpers.app.fullname" (dict "kindShort" "tr" "name" $seName "context" $root) }}
  namespace: {{ $namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  parentRefs:
    - group: networking.istio.io
      kind: ServiceEntry
      name: {{ $seFullname }}
  rules:
    - backendRefs:
        - name: {{ $gwFullname }}
          namespace: {{ $root.Release.Namespace | quote }}
          port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "egress-gateway.helpers.app.fullname" (dict "kindShort" "tr" "parent" $gwName "name" $seName "context" $root) }}
  namespace: {{ $root.Release.Namespace | quote }}
  {{- include "egress-gateway.helpers.app.metadata" (dict "context" $root) | nindent 2 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gwFullname }}
      sectionName: {{ $listener }}
  hostnames:
    - {{ $hostname | quote }}
  rules:
    - backendRefs:
        - group: networking.istio.io
          kind: Hostname
          name: {{ $hostname | quote }}
          port: 443
{{- end }}
{{- end }}
{{- end }}
{{- end }}
