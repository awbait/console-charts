# Минимальный пример: один выход наружу.
# Гейтвей с одним listener'ом (его чарт выводит из домена внешнего сервиса), один
# внешний сервис в namespace релиза, пара маршрутов до него и один
# VpcEgressGateway (kube-ovn), чьи селекторы указывают на этот гейтвей.
#
# Имена ресурсов по конвенции: {instance}-{cluster}-{kindShort}-{project}-{name}
# С тегами ниже получится:
# - ConfigMap            ed-dev-egw-nbox-eg
# - Gateway              ed-dev-egw-nbox-eg
# - ServiceEntry         ed-dev-egw-nbox-nx
# - TLSRoute             ed-dev-tr-nbox-nx и ed-dev-tr-eg-nbox-nx
# - NetworkPolicy        ed-dev-np-eg-nbox-out и ed-dev-np-eg-nbox-in
# - AuthorizationPolicy  ed-dev-ap-nbox-eg
# - VpcEgressGateway     ed-dev-veg-nbox-core

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}
  annotations: {}

egressGateway:
  enabled: true
  name: eg

serviceEntries:
  - name: nx
    hostname: repository.solution.test

networkPolicy:
  enabled: true
  endpoints:
    - address: 10.40.20.50
      port: 443

authorizationPolicy:
  enabled: true

vpcEgressGateway:
  - name: core
    externalIPs:
      - 10.193.101.10
      - 10.193.101.11
