# Mesh: локальные waypoint в namespace отправителей, один общий выход.
global:
  identity:
    instance: ed
    cluster: dev
    project: nbox
mode: mesh
senders:
  namespace:
    - nbox-dev-ns-app
# Общие HPA и ресурсы waypoint наследуются из values.yaml.
serviceEntries:
  - name: nx
    hostname: repository.solution.test
vpcEgressGateway:
  name: vip
  externalIPs:
    - 10.193.101.10
    - 10.193.101.11
networkPolicy:
  enabled: true
  endpoints:
    - address: 10.40.20.50
      port: 443
authorizationPolicy:
  enabled: true
