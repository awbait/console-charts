# Минимальный пример, режим mesh: отправители в ambient, наружу через выход
# уходит один внешний домен.
#
# Что создаётся (теги ниже):
# - Namespace   nbox-dev-ns-egw-eg   (сабчарт waypointNamespace, в сетке)
#   Gateway     ed-dev-wp-nbox-eg    (сабчарт waypoint: egress-гейтвей и его ConfigMap)
# - Namespace   nbox-dev-ns-veg-vip  (сабчарт vegNamespace, вне сетки)
#   VpcEgressGateway ed-dev-veg-nbox-vip
# - в namespace отправителей nbox-dev-ns-app:
#   ServiceEntry  ed-dev-egw-nbox-nx
#   NetworkPolicy ed-dev-np-eg-nbox-senders
# - в nbox-dev-ns-egw-eg:
#   NetworkPolicy ed-dev-np-eg-nbox-out и ed-dev-np-eg-nbox-in
#   AuthorizationPolicy ed-dev-ap-nbox-eg

global:
  identity:
    instance: ed         # тег инстанса окружения
    cluster: dev         # тег кластера окружения
    project: nbox        # тег проекта, до 9 символов
  namespacePurpose: egw-eg

mode: mesh

senders:
  namespace: nbox-dev-ns-app

serviceEntries:
  - name: nx
    hostname: repository.solution.test

vpcEgressGateway:
  name: vip
  externalIPs:
    - 10.193.101.10
    - 10.193.101.11

networkPolicy:
  enabled: true
  endpoints:
    - address: 10.40.20.50
      port: 443

authorizationPolicy:
  enabled: true

waypointNamespace:
  waypoint:
    waypoints:
      - name: eg
        for: service
        # Namespace отправителей: без него привязка ServiceEntry из чужого
        # namespace к waypoint'у не действует.
        allowedNamespaces:
          - nbox-dev-ns-app
        hpa:
          enabled: true
          minReplicas: 2
          maxReplicas: 5
          averageUtilization: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 2000m
            memory: 1024Mi
