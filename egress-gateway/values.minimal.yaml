# Минимальный пример: одна точка egress.
# Один Gateway с одним TLS Passthrough listener (nx). Из listener генерируются
# ServiceEntry и один TLSRoute (Kind маршрута берётся из протокола listener).
# Плюс один VpcEgressGateway (kube-ovn), чьи селекторы указывают на этот Gateway.
#
# Имена ресурсов по конвенции: {instance}-{cluster}-{kindShort}-{project}-{name}
# С тегами ниже получится:
# - ConfigMap        ed-dev-egw-nbox-wp
# - Gateway          ed-dev-egw-nbox-wp
# - ServiceEntry     ed-dev-egw-nbox-nx
# - TLSRoute         ed-dev-egw-wp-nbox-nx   (parent = Gateway, name = listener)
# - VpcEgressGateway ed-dev-veg-nbox-core

identity:
  instance: ed         # тег инстанса окружения
  cluster: dev         # тег кластера окружения
  project: nbox        # тег проекта, до 9 символов

generic:
  labels: {}
  annotations: {}

egressGateway:
  enabled: true
  name: wp
  listeners:
    - name: nx
      hostname: repository.solution.test
      port: 443
      protocol: TLS
      addresses:
        - 10.40.20.50

vpcEgressGateway:
  - name: core
    externalIPs:
      - 10.193.101.10
      - 10.193.101.11
