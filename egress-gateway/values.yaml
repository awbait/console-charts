# Дефолты без данных заказа. Задайте identity, namespace, externalIPs и mesh-сервисы.

# Общие теги для ресурсов чарта и namespace выхода. identity заполняет заказ.
global: {}
# Общие метки и аннотации собственных ресурсов, включая локальные waypoint.
generic:
  labels: {}
  annotations: {}
# mesh: домены и фиксированные IPv4 через локальные waypoint. direct: SNAT без сервисной сетки.
mode: mesh
# Namespace существуют заранее. В mesh список задаёт размещение waypoint,
# в direct со scope label ограничивает выбор подов. список subnet
# содержит имена Subnet для direct со scope subnet, независимо от имён namespace.
senders:
  namespace: []
  subnet: []
# Только mesh. Общие настройки всех waypoint в senders.namespace.
# HPA масштабирует каждый waypoint независимо. CPU считается от requests.cpu.
# enabled: false не удаляет существующий HPA при обновлении.
# Для фиксированного числа реплик задайте minReplicas равным maxReplicas.
waypoint:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    averageUtilization: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1024Mi
# Только mesh: каждая включённая запись создаётся в каждом namespace отправителей.
# Имя и hostname с доменом либо конкретным IPv4 обязательны. IP без CIDR
# и ведущих нулей, 0.0.0.0 не поддерживается. По умолчанию port: 443,
# protocol: TLS, enabled: true. Домен или IP нельзя повторять даже с другим портом.
serviceEntries: []
# Один выход на релиз, replicas равен числу externalIPs. vpc: ovn-cluster,
# internalSubnet: ovn-default и externalSubnet: egress-vip зафиксированы. Имя 2..9 символов задаёт и имя waypoint.
# В direct scope subnet: SNAT для всех указанных Subnet, scope label:
# поды из списка namespace с меткой <label>=<полное имя выхода>.
# limitRange задаёт requests/limits контейнерам без собственных ресурсов в namespace выхода.
# nodeSelector и tolerations здесь заменяют настройки gatewayScheduling целиком,
# пустые списки отключают соответствующее умолчание.
vpcEgressGateway:
  name: vip
  externalIPs: []
  scope: subnet
  label: ecpk/egress
  limitRange:
    enabled: true
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 256Mi
# Размещение подов VpcEgressGateway. nodeSelector: список условий kube-ovn
# (между условиями ИЛИ, внутри И). tolerations: формат PodSpec.
# По умолчанию пусто, правила задаёт платформа. affinity API не поддерживает.
gatewayScheduling:
  nodeSelector: []
  tolerations: []
# Только mesh. В каждом namespace: вход waypoint из своего namespace на 15008,
# выход к istiod:15012, DNS:1053 TCP/UDP и внешним endpoints.
# IPv4 и порты включённых serviceEntries добавляются автоматически, одиночный
# IP становится /32. endpoints дополняет их, совпадения адреса и порта убираются.
# Для доменов адреса задаются вручную. Нужен хотя бы один ручной endpoint или
# включённая IPv4-запись. address: IP или CIDR, port: TCP-порт.
# senders: true добавляет подам namespace выход к локальному waypoint на 15008.
networkPolicy:
  enabled: false
  senders: true
# Только mesh: ALLOW на локальный Gateway только из его namespace, через targetRefs.
authorizationPolicy:
  enabled: false
# Сабчарт namespace выхода: всегда включён, роль egress, privileged, вне ambient.
# namespace.name задаёт назначение в имени {project}-{cluster}-ns-{назначение}.
# Namespace использует дефолтную подсеть ovn-default. Создание своей подсети запрещено.
# Остальные параметры сабчарта описаны в чарте namespace.
vegNamespace:
  enabled: true
  namespace:
    name: veg-vip
    displayName: Egress VIP
    role: egress
    podSecurity: privileged
  serviceMesh:
    enabled: false
    never: true
    waypoint: false
  resourceQuotas:
    limits:
      cpu: '2'
      memory: 2Gi
    podsAmount: 10
  # Внутренний флаг сабчарта, зафиксирован в false. Подсеть не создаётся.
  subnet:
    enabled: false
