apiVersion: v2
name: egress-gateway
description: Выпускает трафик ваших сервисов наружу через одну контролируемую точку. Нужен, когда во внешние системы можно ходить только с известного адреса.
type: application
version: 10.0.0
appVersion: "1.0.0"
icon: data:image/svg+xml;base64,
maintainers:
  - name: core
dependencies:
  # Только namespace выхода. Waypoint создаётся в существующих namespace отправителей.
  - name: namespace
    version: "7.3.0"
    repository: "file://../namespace"
    alias: vegNamespace
    condition: vegNamespace.enabled
