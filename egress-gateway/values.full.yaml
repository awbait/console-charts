# ============================================================================
#  Helm-чарт: egress-gateway - полный reference значений
#  Все параметры с описанием. Чарт разворачивает выход наружу через Istio
#  egress-gateway (Gateway API) и kube-ovn VpcEgressGateway. Независимые секции:
#
#    egressGateway      - ОДИН Gateway класса istio и его ConfigMap. Listener'ы
#                         чарт выводит из доменов внешних сервисов: по одному на
#                         домен, порт 443, протокол TLS. Пользователь задаёт имя,
#                         автомасштабирование и ресурсы.
#
#    serviceEntries[]   - внешние сервисы, к которым нужен доступ. На каждый
#                         создаётся ServiceEntry в namespace отправителя, пара
#                         TLSRoute (отправитель -> шлюз и шлюз -> домен) и, при
#                         чужом namespace, ReferenceGrant.
#
#    networkPolicy      - две NetworkPolicy на под'ы шлюза: куда шлюзу можно
#                         ходить и кто может ходить к нему на порт 443.
#
#    authorizationPolicy - AuthorizationPolicy (Istio): пускает бэкенды к шлюзу.
#
#    egressNamespace    - по флагу создаёт namespace с лейблом role=egress и
#                         подсеть /29 под VpcEgressGateway.
#
#    vpcEgressGateway[] - VpcEgressGateway (kube-ovn): egress на уровне VPC
#                         (externalIPs, SNAT-политики). Его селекторы выводятся
#                         так, чтобы указывать на Gateway выше.
#
#  Имя каждого ресурса:
#    {instance}-{cluster}-{kindShort}-{project}-{name}
# ============================================================================


# ----------------------------------------------------------------------------
# identity - теги окружения и проекта (см. схему имени выше)
# ----------------------------------------------------------------------------
# instance / cluster / project задаются один раз на релиз.
# kindShort подставляется автоматически по типу ресурса:
#   egw - Istio Egress-Gateway  (Gateway, ConfigMap, ServiceEntry)
#   veg - VPC Egress Gateway    (VpcEgressGateway)
#   np  - NetworkPolicy         ap - AuthorizationPolicy
#   tr  - TLSRoute              rg - ReferenceGrant
# name задаётся на каждый ресурс (2..6 символов, DNS-формат). У NetworkPolicy и
# у исходящего TLSRoute перед проектом стоит имя шлюза, потому что на один шлюз
# их по паре: {instance}-{cluster}-np-{gateway}-{project}-{out|in} и
# {instance}-{cluster}-tr-{gateway}-{project}-{name}.
#
# Эти же теги проставляются на каждый ресурс чарта как labels:
#   ecpk/instance: <instance>
#   ecpk/cluster:  <cluster>
#   ecpk/project:  <project>
identity:
  # Тег инстанса окружения. Обязателен. Допустимые значения - в README.md.
  instance: ed

  # Тег кластера окружения. Обязателен. Допустимые значения - в README.md.
  cluster: dev

  # Тег проекта. Обязателен. До 9 символов: строчные латинские буквы, цифры
  # и дефис (дефис не может быть первым или последним символом).
  project: nbox

generic:
  # Общие labels для всех ресурсов чарта.
  labels:
    environment: production
    team: platform

  # Общие annotations для всех ресурсов чарта.
  annotations:
    owner: platform-team
    monitoring: "true"


# ============================================================================
# egressGateway - ОДИН шлюз класса istio (Gateway + ConfigMap)
# ============================================================================
# Один Gateway на релиз. Listener'ы задавать не нужно: чарт делает по одному на
# каждый домен из serviceEntries[]. Имя listener'а - последний уровень домена
# (kc.idp.ecpk.test -> kc), порт всегда 443, протокол TLS, режим Passthrough,
# allowedRoutes - from: Same (исходящие маршруты создаются рядом со шлюзом).
#   name    - обязателен, 2..6 символов; {name} в имени Gateway/ConfigMap (egw)
#   enabled - по умолчанию true; false -> ничего из этой секции не создаётся
#   hpa     - автомасштабирование создаваемого Deployment
#   resources - ресурсы контейнера istio-proxy (уезжают в ConfigMap.data.deployment)
egressGateway:
  enabled: true
  name: eg

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    averageUtilization: 80

  # Служебное поле, в форме портала скрыто. Значения ниже - дефолт чарта.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1024Mi


# ============================================================================
# serviceEntries - внешние сервисы, список
# ============================================================================
# На каждый элемент чарт создаёт:
#   ServiceEntry     в namespace отправителя;
#   TLSRoute         отправитель -> шлюз (рядом с ServiceEntry: parentRefs на
#                    ServiceEntry, backendRefs на Service шлюза, порт 443);
#   TLSRoute         шлюз -> домен (рядом со шлюзом: parentRefs на Gateway с
#                    привязкой к listener'у, backendRefs на сам домен);
#   listener         на Gateway, по одному на домен;
#   ReferenceGrant   рядом со шлюзом, если отправитель в другом namespace.
# Захардкожено в шаблоне (НЕ настраивается здесь):
#   location MESH_EXTERNAL, resolution DNS, порт tls/443/TLS;
#   exportTo ["."] и, при чужом namespace, ещё и namespace шлюза.
# Пользователь задаёт:
#   name      - обязателен, 2..6 символов; {name} в имени ресурса (egw)
#   hostname  - обязателен, домен внешнего сервиса
#   namespace - необязателен; namespace отправителя. Пусто -> namespace релиза
#   enabled   - по умолчанию true
serviceEntries:
  - name: nx
    hostname: repository.solution.test

  - name: art
    hostname: artifactory.solution.test
    # Отправитель лежит в другом namespace: ServiceEntry и маршрут до шлюза
    # уедут туда, а рядом со шлюзом появится ReferenceGrant.
    namespace: nbox-apps
    # Служебное поле, в форме портала скрыто. По умолчанию true.
    enabled: true


# ============================================================================
# networkPolicy - две NetworkPolicy на под'ы шлюза
# ============================================================================
# enabled: true -> создаются обе политики сразу:
#   {gateway}-out - куда шлюзу можно ходить. Захардкожено: istiod
#                   (istio-system, порт 15012) и CoreDNS (kube-system, порт 1053
#                   по TCP и UDP). Остальное - ваши endpoints ниже.
#   {gateway}-in  - кто может ходить к шлюзу: namespace ваших сервисов из
#                   serviceEntries[] и namespace релиза, порт 443.
# endpoints[] обязателен при enabled: true - иначе шлюз не дойдёт ни до одного
# внешнего сервиса. По записи на адрес и порт:
#   address - IP внешней точки или подсеть в формате CIDR (одиночный IP чарт
#             сам превращает в /32)
#   port    - порт внешней точки, TCP
networkPolicy:
  enabled: true
  endpoints:
    - address: 10.40.20.50
      port: 443

    - address: 10.40.20.0/24
      port: 8443


# ============================================================================
# authorizationPolicy - AuthorizationPolicy (Istio) на шлюз
# ============================================================================
# enabled: true -> создаётся политика ALLOW, которая пускает к шлюзу трафик из
# namespace ваших сервисов (тех же, что и у networkPolicy) и из namespace
# релиза. Политика привязывается к Gateway через targetRefs. Настраивать в ней
# нечего: список источников чарт выводит из serviceEntries[].
authorizationPolicy:
  enabled: true


# ============================================================================
# egressNamespace - отдельный namespace и подсеть под VpcEgressGateway
# ============================================================================
# Два варианта размещения VpcEgressGateway:
#   enabled: false - шлюз встаёт в namespace релиза, ничего не создаётся,
#                    SNAT пишется на подсеть с именем namespace релиза;
#   enabled: true  - чарт создаёт namespace с лейблом role=egress и одноимённую
#                    подсеть kube-ovn на /29, шлюз встаёт туда, SNAT пишется на
#                    эту подсеть.
# Имя namespace и подсети задаёте вы: оба видны за пределами релиза, поэтому
# 5-частная конвенция имён к ним не применяется.
# Захардкожено в подсети (НЕ настраивается здесь): default=false, protocol=IPv4,
# natOutgoing=false, gatewayType=centralized, private=true, enableEcmp=false,
# адрес шлюза (первый адрес блока), привязка к одному namespace.
egressNamespace:
  enabled: true

  # Имя namespace и одноимённой подсети. Обязательно при enabled: true.
  name: nbox-egress

  # CIDR подсети, зарезервированный в Netbox. Всегда /29: в подсети живут только
  # адрес шлюза и под'ы VpcEgressGateway. Обязательно при enabled: true.
  cidrBlock: 10.20.30.8/29

  # Подсети проекта, с которыми подсети egress разрешена связность.
  # Служебную Service-Subnet (172.30.0.0/15) чарт добавляет сам.
  allowSubnets:
    - 10.20.30.0/29


# ============================================================================
# vpcEgressGateway - VpcEgressGateway (kube-ovn), список
# ============================================================================
# Захардкожено в шаблоне (НЕ настраивается здесь): vpc, externalSubnet
# (egress-vip), trafficPolicy, nodeSelector. Менять - в
# templates/VPCEgressGateway.yaml. Шлюзы прибиты к мастер-узлам: ingress-шлюз
# сервиса живёт на воркерах, и делить узел с ним они не должны.
# Выводится автоматически (НЕ настраивается здесь):
#   namespace = namespace из egressNamespace или namespace релиза;
#   replicas  = число externalIPs;
#   selectors = namespaceSelector + podSelector, указывающие на Gateway выше
#               (namespace релиза + под'ы этого шлюза);
#   policies  = SNAT на подсеть, одноимённую namespace шлюза.
# Пользователь задаёт:
#   name        - обязателен, 2..6 символов; {name} в имени ресурса (veg)
#   enabled     - по умолчанию true
#   externalIPs - обязателен, внешние IP (replicas = len(externalIPs))
vpcEgressGateway:
  - name: core
    externalIPs:
      - 10.193.101.10
      - 10.193.101.11

  - name: core2
    # Служебное поле, в форме портала скрыто. По умолчанию true.
    enabled: true
    externalIPs:
      - 10.193.101.12
      - 10.193.101.13
      - 10.193.101.14

# ----------------------------------------------------------------------------
# Служебные поля
# ----------------------------------------------------------------------------
# global - глобальные значения Helm. Инжектятся автоматически, когда чарт
# подключён сабчартом. Шаблоны чарта их не используют.
global: {}

# enabled - главный выключатель чарта. false -> не создаётся ни один ресурс.
# По умолчанию true, поэтому заказ из портала и обычный helm install создают
# ресурсы сразу. Ставь false, если чарт подключён сабчартом и должен молчать.
enabled: true
